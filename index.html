function finishResearch(){
  const r = state.research;
  if(!r) return;
  state.research = null;
  const node = BRANCH_NODES.find(n => n.id === r.nodeId);
  if(!node) return;
  state.tech[r.nodeId] = r.nextLv;
  const unlockKey = ({army_t2:'tier2Unlock', army_t3:'tier3Unlock', army_t4:'tier4Unlock', army_t5:'tier5Unlock'})[r.nodeId];
  if(unlockKey) state.tech[unlockKey] = r.nextLv;
  toast(`✅ ${node.name} Nv.${r.nextLv} completado`);
  if(techScreenOpen) renderTechScreen();
  if(selectedTechId) renderTechDetailModal();
}

function skipResearch(){
  const r = state.research;
  if(!r) return;
  const gems = getResearchSkipGems(r);
  if((state.gems || 0) < gems){
    toast(`💎 Necesitas ${gems} diamantes para acelerar`);
    return;
  }
  state.gems -= gems;
  finishResearch();
  saveState();
  renderHUD();
  if(techScreenOpen) renderTechScreen();
}

function doResearchNode(nodeId, instant = false){
  const node = BRANCH_NODES.find(n => n.id === nodeId);
  if(!node) return;
  if(!isBranchNodeUnlocked(node)){
    toast(node.reqWarHall && getWarHallLv() <= 0
      ? '🔒 Construye primero la Sala de Combate'
      : '🔒 Completa los requisitos de esta investigación');
    return;
  }
  const curLv = state.tech[nodeId] || 0;
  if(curLv >= node.maxLv){
    toast('✨ Ya alcanzó su nivel máximo');
    return;
  }
  if(state.research){
    const cur = BRANCH_NODES.find(n => n.id === state.research.nodeId);
    toast(`⏳ Ya estás investigando «${cur ? cur.name : 'otra tecnología'}». Solo puedes hacer una a la vez`);
    return;
  }
  const nextLv = curLv + 1;
  const cost = getNodeCostForLv(node, nextLv);
  if(!hasRes(cost)){
    toast('❌ Recursos insuficientes · mira tu Depósito 🎒');
    openDepositFor(cost);
    return;
  }
  const dur = getTechCooldownSec(nextLv);
  const gemCost = 10 + nextLv * 5 + Math.ceil(dur / 10);
  if(instant){
    if((state.gems || 0) < gemCost){
      toast(`💎 Necesitas ${gemCost} diamantes`);
      return;
    }
    state.gems -= gemCost;
  }
  payRes(cost);
  state.research = {nodeId, nextLv, rem:dur, total:dur};
  if(instant) finishResearch();
  else toast(`🔬 Investigando ${node.name} Nv.${nextLv} · ${fmtTime(dur)}`);
  saveState();
  renderHUD();
  renderTechScreen();
  renderTechDetailModal();
}

function renderTechDetailModal(){
  const card = document.getElementById('techDetailCard');
  if(!card || !selectedTechId) return;
  const node = BRANCH_NODES.find(n => n.id === selectedTechId);
  if(!node) return;
  const curLv = state.tech[node.id] || 0;
  const isMax = curLv >= node.maxLv;
  const unlocked = isBranchNodeUnlocked(node);
  const nextLv = Math.min(node.maxLv, curLv + 1);
  const curVal = getNodeValueAtLv(node, curLv);
  const nextVal = getNodeValueAtLv(node, nextLv);
  const deltaVal = Math.max(0, nextVal - curVal);
  const cost = getNodeCostForLv(node, nextLv);
  const remCd = getActiveTechCooldown(node.id);
  const cdSec = getTechCooldownSec(nextLv);
  const canPay = !isMax && unlocked && !state.research && hasRes(cost);
  const gemCost = 10 + nextLv * 5 + Math.ceil(cdSec / 10);
  const activeNode = state.research ? BRANCH_NODES.find(n => n.id === state.research.nodeId) : null;
  const prefix = node.statType === 'reduction' ? '-' : '+';
  const statLabel = ({
    prod:'Producción', gather:'Recursos obtenidos', attack:'Ataque de tropas',
    defense:'Resistencia de tropas', health:'Supervivencia', reduction:'Tiempo',
    capacity:'Tamaño del lote', speed:'Velocidad de patrulla',
    recovery:'Tropas recuperadas', unlock:'Desbloqueo'
  })[node.statType] || 'Bonificación';
  const parNode = node.reqParent ? BRANCH_NODES.find(n => n.id === node.reqParent) : null;
  const requirementText = node.reqMilitary
    ? `Completa TODA la rama militar: Ataque, Defensa y Salud de los 4 tipos de tropa (${getMilitaryDone()}/${MIL_TOTAL_LEVELS}).`
    : (parNode && (state.tech[parNode.id] || 0) < parNode.maxLv
      ? `Completa primero «${parNode.name}» al nivel máximo.`
      : (node.reqNode && !(state.tech[node.reqNode] > 0)
        ? `Investiga primero ${BRANCH_NODES.find(n => n.id === node.reqNode)?.name || 'el requisito anterior'}.`
        : (node.reqWarHall && getWarHallLv() <= 0
          ? 'Construye primero la Sala de Combate.'
          : 'Completa los requisitos indicados.')));

  card.innerHTML = `
    <div class="td-head">
      <div class="td-title">${node.name}</div>
      <button type="button" class="td-close" onclick="closeTechDetailModal()">✕</button>
    </div>
    <div class="td-intro">
      <div class="td-ico-box">
        <span>${node.ico}</span>
        <span class="hex-prog" style="position:absolute;bottom:-8px;margin:0">${curLv}/${node.maxLv}</span>
      </div>
      <div style="font-size:12px;color:#e2e8f0;line-height:1.35">${node.desc}</div>
    </div>

    <div class="td-box">
      <div class="td-row">
        <span><b>Nivel ${curLv}</b> → <b>${nextLv}</b></span>
        <span style="color:var(--mute);font-weight:800">${node.statType === 'unlock' ? 'Tropas' : 'Efecto acumulado'}</span>
      </div>
      ${node.statType === 'unlock'
        ? `<div class="td-row"><span>Estado</span><span style="color:${curLv ? 'var(--ok)' : 'var(--gold)'};font-weight:900">${curLv ? 'Desbloqueado' : (unlocked ? 'Disponible' : 'Bloqueado')}</span></div>`
        : `<div class="td-row"><span>${statLabel}</span><span style="color:var(--gold);font-weight:900">${prefix}${curVal}% → ${prefix}${nextVal}% (${prefix}${deltaVal}%)</span></div>`}
    </div>

    ${!unlocked && !isMax ? `<div class="prereq-box">🔒 ${requirementText}</div>` : ''}
    <div class="td-box">
      <div style="font-size:12px;font-weight:900;color:var(--gold);margin-bottom:4px">Costo (Tienes / Necesitas)</div>
      <div class="td-cost-grid">
        ${Object.keys(cost).map(k => {
          const r = RES.find(x => x.id === k);
          const have = Math.floor(state.res[k] || 0);
          const need = cost[k];
          const ok = have >= need;
          return `
            <div class="td-cost-item ${ok ? 'ok' : 'no'}">
              <span>${r ? r.ico : ''} ${r ? r.name : k}</span>
              <span>${fmtNum(have)}/${fmtNum(need)}</span>
            </div>`;
        }).join('')}
      </div>
    </div>

    ${!isMax && unlocked ? (remCd > 0
      ? `<div class="research-banner">🔬 Investigando… <b>${fmtTime(remCd)}</b>
           <div class="td-btns"><button type="button" class="btn gem sm" onclick="skipResearch()">⚡ Acelerar<br><small>💎 ${getResearchSkipGems(state.research)}</small></button></div>
         </div>`
      : (state.research
        ? `<div class="prereq-box">⏳ Ya estás investigando «${activeNode ? activeNode.name : '…'}» (${fmtTime(state.research.rem)}). Solo puedes investigar una cosa a la vez.</div>`
        : `<div class="td-row" style="margin-bottom:4px">
             <span>⏱️ Tiempo de investigación (Nv.${nextLv})</span>
             <b style="color:var(--gold)">${fmtTime(cdSec)}</b>
           </div>
           <div class="td-btns">
             <button type="button" class="btn gem sm ${(hasRes(cost) && (state.gems||0)>=gemCost) ? '' : 'dim'}" onclick="doResearchNode('${node.id}', true)">
               ⚡ Completar ahora<br><small>💎 ${gemCost}</small>
             </button>
             <button type="button" class="btn sm ${canPay ? '' : 'dim'}" onclick="doResearchNode('${node.id}', false)">
               🔬 Investigar (${fmtTime(cdSec)})<br><small>Nv. ${curLv} → ${nextLv}</small>
             </button>
           </div>`))
      : (isMax ? `<div class="prereq-ok" style="text-align:center">✅ Nivel máximo completado</div>` : '')}
  `;
}

function researchBannerHtml(){
  const r = state.research;
  if(!r) return `<div class="research-banner" style="opacity:.85">🔬 Sin investigación activa · solo se puede investigar <b>una a la vez</b>.</div>`;
  const node = BRANCH_NODES.find(n => n.id === r.nodeId);
  const pct = Math.max(3, Math.min(100, Math.round((1 - r.rem / Math.max(1, r.total)) * 100)));
  return `<div class="research-banner">
    🔬 Investigando: <b>${node ? node.ico + ' ' + node.name : ''} Nv.${r.nextLv}</b> · ${fmtTime(r.rem)}
    <div class="bar"><span style="width:${pct}%"></span></div>
    <button type="button" class="btn gem sm" onclick="skipResearch()">⚡ Acelerar por ${getResearchSkipGems(r)} 💎</button>
  </div>`;
}

function techHexHtml(node){
  if(!node) return '<div></div>';
  const lv = state.tech[node.id] || 0;
  const val = getNodeValueAtLv(node, lv);
  const unlocked = isBranchNodeUnlocked(node);
  const researching = state.research && state.research.nodeId === node.id;
  const cls = `${lv >= node.maxLv ? 'max-node' : (lv > 0 || researching ? 'active-node' : '')} ${unlocked ? '' : 'locked-node'}`;
  const sign = node.statType === 'reduction' ? '-' : '+';
  const effect = researching ? '🔬 ' + fmtTime(state.research.rem)
    : (node.statType === 'unlock'
      ? (lv > 0 ? 'Desbloqueado' : (unlocked ? 'Disponible' : 'Bloqueado'))
      : `${sign}${val}%`);
  return `
    <button type="button" class="hex-node-btn ${cls}" onclick="openTechDetailModal('${node.id}')">
      <div class="hex-badge"><span>${node.ico}</span></div>
      <span class="hex-prog">${lv}/${node.maxLv}</span>
      <span class="hex-lbl">${node.name}</span>
      <span class="hex-stat">${effect}</span>
    </button>`;
}

function armyTreeHtml(){
  const N = id => BRANCH_NODES.find(n => n.id === id);
  const rowFour = prefix => `<div class="tree-tier-row four">${MIL_TYPES.map(t => techHexHtml(N(prefix + '_' + t.k))).join('')}</div>`;
  const one = id => `<div class="tree-tier-row one">${techHexHtml(N(id))}</div>`;
  const con = `<div class="tree-connector-v"></div>`;
  return `
    <div class="info-box" style="margin-bottom:8px">
      <div class="info-row"><span>Rama militar</span><b>${getMilitaryDone()}/${MIL_TOTAL_LEVELS} niveles</b></div>
      <div class="info-row"><span>Al completarla</span><b>Se desbloquea T2 ⭐</b></div>
    </div>
    <div class="tech-tree-wrap">
      <div class="tree-row-lbl">⚔️ ATAQUE DE ESCUADRÓN</div>
      ${one('sq_atk')}
      ${con}<div class="tree-connector-h"></div>
      <div class="tree-tier-row four tree-hdr">${MIL_TYPES.map(t => `<div class="tree-col-lbl">${t.ico}<span>${t.n}</span></div>`).join('')}</div>
      <div class="tree-row-lbl">Ataque por tipo</div>
      ${rowFour('atk')}
      ${con}
      <div class="tree-row-lbl">🛡️ Defensa por tipo</div>
      ${rowFour('def')}
      ${con}
      <div class="tree-row-lbl">❤️ Salud por tipo</div>
      ${rowFour('hp')}
      ${con}
      <div class="tree-row-lbl">⭐ DESBLOQUEO DE TROPAS</div>
      ${one('army_t2')}${con}${one('army_t3')}${con}${one('army_t4')}${con}${one('army_t5')}
    </div>`;
}

function renderTechScreen(){
  const gemEl = $('#techScreenGems');
  if(gemEl) gemEl.textContent = fmtNum(state.gems || 0);

  const tabsEl = $('#techBranchTabs');
  if(tabsEl){
    const branches = [
      {id:'prod', label:'🌾 Producción'},
      {id:'army', label:'⚔️ Ejército'},
      {id:'logistics', label:'⚙️ Logística'}
    ];
    tabsEl.innerHTML = branches.map(b =>
      `<button type="button" class="tb-btn ${activeTechBranch===b.id?'active':''}" onclick="activeTechBranch='${b.id}';renderTechScreen()">${b.label}</button>`
    ).join('');
  }

  const bodyEl = $('#techScreenBody');
  if(!bodyEl) return;
  const items = BRANCH_NODES.filter(n => n.branch === activeTechBranch);
  const tiers = [...new Set(items.map(n => n.tier))].sort((a,b) => a - b);

  const headerNote = activeTechBranch === 'prod'
    ? `<div class="info-box" style="margin-bottom:10px">
         <div class="info-row"><span>⬅️ Izquierda</span><b>Aumento de producción (5 niveles)</b></div>
         <div class="info-row"><span>➡️ Derecha</span><b>Más recursos por nodo del mapa (5 niveles)</b></div>
       </div>`
    : '';

  const treeHtml = tiers.map((t, idx) => {
    const leftNode = items.find(n => n.tier === t && n.side === 'left');
    const rightNode = items.find(n => n.tier === t && n.side === 'right');
    const renderHex = (node) => {
      if(!node) return '<div></div>';
      const lv = state.tech[node.id] || 0;
      const val = getNodeValueAtLv(node, lv);
      const unlocked = isBranchNodeUnlocked(node);
      const cls = `${lv >= node.maxLv ? 'max-node' : (lv > 0 ? 'active-node' : '')} ${unlocked ? '' : 'locked-node'}`;
      const sign = node.statType === 'reduction' ? '-' : '+';
      const effect = node.statType === 'unlock'
        ? (lv > 0 ? 'Desbloqueado' : (unlocked ? 'Disponible' : 'Bloqueado'))
        : `${sign}${val}%`;
      return `
        <button type="button" class="hex-node-btn ${cls}" onclick="openTechDetailModal('${node.id}')">
          <div class="hex-badge"><span>${node.ico}</span></div>
          <span class="hex-prog">${lv}/${node.maxLv}</span>
          <span class="hex-lbl">${node.name}</span>
          <span class="hex-stat">${effect}</span>
        </button>`;
    };
    return `
      ${idx > 0 ? `<div class="tree-connector-v"></div><div class="tree-connector-h"></div>` : ''}
      <div class="tree-tier-row">
        ${renderHex(leftNode)}
        ${renderHex(rightNode)}
      </div>`;
  }).join('');

  bodyEl.innerHTML = researchBannerHtml() + (activeTechBranch === 'army' ? armyTreeHtml() : headerNote + `<div class="tech-tree-wrap">${treeHtml}</div>`);
}

  if(!dragging) return;
  const nx = e.clientX - dragStart.x;
  const ny = e.clientY - dragStart.y;
  if(Math.hypot(nx - cam.x, ny - cam.y) > 6) wasDragging = true;
  cam.x = nx;
  cam.y = ny;
  applyCam();
});

  setTimeout(() => { wasDragging = false; }, 40);
});

vpEl.addEventListener('touchstart', (e) => {
  if(e.touches && e.touches.length === 2){
    dragging = false;
    wasDragging = true;
    const t0 = e.touches[0], t1 = e.touches[1];
    pinchStartDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY) || 1;
    pinchStartZoom = userZoom;
    pinchMid = {x:(t0.clientX + t1.clientX)/2, y:(t0.clientY + t1.clientY)/2};
  }
}, {passive:true});

vpEl.addEventListener('touchmove', (e) => {
  if(e.touches && e.touches.length === 2){
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY) || 1;
    const midX = (t0.clientX + t1.clientX)/2;
    const midY = (t0.clientY + t1.clientY)/2;
    setZoomFactor(pinchStartZoom * (dist / pinchStartDist), midX, midY);
  }
}, {passive:false});

vpEl.addEventListener('touchend', (e) => {
  if(!e.touches || e.touches.length < 2){
    pinchStartDist = 0;
  }
}, {passive:true});

function getHeroById(id){
  return HEROES.find(h => h.id === id) || HEROES[0];
}

function getTroopCountByCat(cat){
  const t = state.troops || {};
  if(cat === 'infantry') return (t.infantry || 0) + (t.infantry2 || 0);
  if(cat === 'cavalry') return (t.cavalry || 0) + (t.cavalry2 || 0);
  if(cat === 'artillery') return (t.artillery || 0) + (t.artillery2 || 0);
  if(cat === 'siege') return (t.siege || 0) + (t.siege2 || 0);
  return 0;
}

    enemy: {
      name: 'Guardián de Mazmorra', role: 'Coliseo', ico: '👹',
      hp: 560, maxHp: 560, atk: 32, def: 16, critChance: 0.22,
      shield: 0, ultCharge: 0,
      cd: {s1: 0, s2: 0},
      anim: '',
      log: []
    },
    logs: [`⚔️ Combate de Héroes iniciado: ${h.name} vs Guardián de Mazmorra.`]
  };
}

function addArenaUltCharge(unit, amount, reason){
  if(!unit || unit.hp <= 0) return;
  const prev = unit.ultCharge;
  unit.ultCharge = Math.min(100, unit.ultCharge + amount);
  if(prev < 100 && unit.ultCharge >= 100 && combatState.arena){
    combatState.arena.logs.unshift(`✨ ¡ULTI LISTA para ${unit.name}! (${reason})`);
  }
}

function applyArenaDamage(attacker, defender, rawDmg, forceCrit = false){
  const isCrit = forceCrit || (Math.random() < (attacker.critChance || 0.15));
  let dmg = Math.max(8, Math.round(rawDmg * (isCrit ? 1.65 : 1) - (defender.def || 0) * 0.35));

  if(defender.shield > 0){
    const absorbed = Math.min(defender.shield, dmg);
    defender.shield -= absorbed;
    dmg -= absorbed;
  }

  defender.hp = Math.max(0, defender.hp - dmg);
  defender.anim = isCrit ? 'crit-hit' : 'hit';
  setTimeout(() => {
    if(combatState.arena){
      if(combatState.arena.player === defender) defender.anim = '';
      if(combatState.arena.enemy === defender) defender.anim = '';
    }
  }, 220);

  // En Mazmorra / Coliseo: la barra de Ulti carga con el tiempo,
  // un poco más rápido si recibe daño, y más rápido aún si recibe daño crítico.
  const gain = isCrit ? 22 : 12;
  addArenaUltCharge(defender, gain, isCrit ? 'daño crítico recibido' : 'daño recibido');

  return {dmg, isCrit};
}

function useArenaSkill(skillKey){
  const ar = combatState.arena;
  if(!ar || !ar.active) return;
  const p = ar.player;
  const e = ar.enemy;
  if(p.hp <= 0 || e.hp <= 0) return;

  if(skillKey === 's1' || skillKey === 's2'){
    if((p.cd[skillKey] || 0) > 0){
      toast('⏳ Habilidad en enfriamiento');
      return;
    }
    const sk = p[skillKey];
    p.cd[skillKey] = sk.cd;
    if(sk.heal){
      p.hp = Math.min(p.maxHp, p.hp + sk.heal);
      ar.logs.unshift(`💚 ${p.name} usa ${sk.name} (+${sk.heal} HP).`);
    }
    if(sk.shield){
      p.shield = (p.shield || 0) + sk.shield;
      ar.logs.unshift(`🛡️ ${p.name} activa ${sk.name} (+${sk.shield} escudo).`);
    }
    if(sk.mult){
      const res = applyArenaDamage(p, e, p.atk * sk.mult, skillKey === 's2' && p.role === 'Tirador');
      ar.logs.unshift(`${res.isCrit ? '💥 CRÍTICO' : '⚔️'} ${p.name} usa ${sk.name} (${res.dmg} daño).`);
    }
  }else if(skillKey === 'ult'){
    if(p.ultCharge < 100){
      toast('⚡ La Ulti aún no está cargada al 100%');
      return;
    }
    p.ultCharge = 0;
    if(p.ult.heal){
      p.hp = Math.min(p.maxHp, p.hp + p.ult.heal);
      p.shield = (p.shield || 0) + (p.ult.shield || 60);
    }
    const res = applyArenaDamage(p, e, p.atk * (p.ult.mult || 2.2), true);
    ar.logs.unshift(`🌟 ¡ULTI ${p.ult.name}! ${p.name} inflige ${res.dmg} de daño${p.ult.heal ? ` y cura +${p.ult.heal} HP` : ''}.`);
  }

  checkArenaEnd();
  renderHUD();
}

function checkArenaEnd(){
  const ar = combatState.arena;
  if(!ar || !ar.active) return;
  if(ar.enemy.hp <= 0){
    ar.active = false;
    ar.won = true;
    state.gems = (state.gems || 0) + 15;
    saveState();
    ar.logs.unshift('🏆 ¡Victoria en Mazmorra/Coliseo! +15 💎');
  }else if(ar.player.hp <= 0){
    ar.active = false;
    ar.won = false;
    ar.logs.unshift('💀 Tu héroe cayó en el coliseo. ¡Inténtalo de nuevo!');
  }
}

function tickHeroArena(dt){
  const ar = combatState.arena;
  if(!ar || !ar.active) return;
  const p = ar.player;
  const e = ar.enemy;

  // Cooldowns y carga pasiva de Ulti por tiempo
  p.cd.s1 = Math.max(0, (p.cd.s1 || 0) - dt);
  p.cd.s2 = Math.max(0, (p.cd.s2 || 0) - dt);
  e.cd.s1 = Math.max(0, (e.cd.s1 || 0) - dt);
  e.cd.s2 = Math.max(0, (e.cd.s2 || 0) - dt);

  addArenaUltCharge(p, 7 * dt, 'paso del tiempo');
  addArenaUltCharge(e, 7 * dt, 'paso del tiempo');

  // Ataque automático periódico del enemigo
  e._atkTimer = (e._atkTimer || 0) + dt;
  if(e._atkTimer >= 2.2){
    e._atkTimer = 0;
    const useCrit = Math.random() < e.critChance;
    const res = applyArenaDamage(e, p, e.atk * (useCrit ? 1.25 : 0.9), useCrit);
    ar.logs.unshift(`${res.isCrit ? '💥 CRÍTICO rival' : '👹 Rival'} golpea por ${res.dmg} daño.`);
    if(e.ultCharge >= 100){
      e.ultCharge = 0;
      const uRes = applyArenaDamage(e, p, e.atk * 1.85, true);
      ar.logs.unshift(`🔥 ¡El guardián lanza su Ulti por ${uRes.dmg} daño!`);
    }
    checkArenaEnd();
  }
}

// Modo 2: Ataque a Jugador (PvP con Tropas + Héroes de Apoyo)
function startPvpBattle(targetIdx){
  ensureHeroState();
  const target = PVP_TARGETS[targetIdx] || PVP_TARGETS[0];
  const cats = [
    {cat:'infantry',  label:'Infantería', ico:'🗡️'},
    {cat:'cavalry',   label:'Caballería', ico:'🐎'},
    {cat:'artillery', label:'Artillería', ico:'🎯'},
    {cat:'siege',     label:'Asedio',     ico:'🧱'}
  ];

  const squads = cats.map(c => {
    const count = getTroopCountByCat(c.cat);
    const heroId = state.heroes.assigned[c.cat];
    const hero = getHeroById(heroId);
    return {
      cat: c.cat,
      label: c.label,
      ico: c.ico,
      troops: count,
      maxTroops: count,
      heroName: hero.name,
      heroIco: hero.ico,
      heroRole: hero.role,
      heroDefeated: count <= 0,
      supportBuff: count > 0
    };
  });

  const enemyPower = Object.values(target.troops).reduce((a,b) => a + b, 0);

  combatState.pvp = {
    active: true,
    won: null,
    targetName: target.name,
    enemyTroops: enemyPower,
    maxEnemyTroops: enemyPower,
    reward: target.reward,
    squads,
    lostByTroop: {},
    supportCd: 0,
    logs: [`🏴 Marcha iniciada contra ${target.name}. Los héroes apoyan a sus tropas.`]
  };
}

function usePvpSupportSkill(){
  const pvp = combatState.pvp;
  if(!pvp || !pvp.active) return;
  if(pvp.supportCd > 0){
    toast('⏳ Apoyo en enfriamiento');
    return;
  }
  pvp.supportCd = 5;

  let activeSupporters = 0;
  let bonusDmg = 0;
  pvp.squads.forEach(sq => {
    if(sq.troops > 0 && !sq.heroDefeated){
      activeSupporters++;
      bonusDmg += Math.max(2, Math.round(sq.troops * 0.25));
      if(sq.cat === 'siege'){
        bonusDmg += 4; // Apoyo extra de asedio/soporte
      }
    }
  });

  pvp.enemyTroops = Math.max(0, pvp.enemyTroops - Math.max(3, bonusDmg));
  pvp.logs.unshift(`✨ Habilidades de apoyo activadas (${activeSupporters} héroes activos): -${Math.max(3, bonusDmg)} fuerzas enemigas.`);
  checkPvpEnd();
  renderHUD();
}

function checkPvpEnd(){
  const pvp = combatState.pvp;
  if(!pvp || !pvp.active) return;
  const totalMyTroops = pvp.squads.reduce((acc, s) => acc + s.troops, 0);
  if(pvp.enemyTroops <= 0){
    pvp.active = false;
    pvp.won = true;
    const cap = getMaxCap();
    RES.forEach(r => {
      if(pvp.reward[r.id]) state.res[r.id] = Math.min(cap, (state.res[r.id] || 0) + pvp.reward[r.id]);
    });
    state.gems = (state.gems || 0) + (pvp.reward.gems || 10);
    if(pvp.reward.books) state.combatBooks = (state.combatBooks || 0) + pvp.reward.books;
    recoverPvpLosses(pvp);
    saveState();
    pvp.logs.unshift(`🏆 ¡Victoria en ${pvp.targetName}! Botín: +${pvp.reward.gems} 💎 y +${pvp.reward.books || 0} 📕 Libros de Combate.`);
  }else if(totalMyTroops <= 0){
    pvp.active = false;
    pvp.won = false;
    recoverPvpLosses(pvp);
    saveState();
    pvp.logs.unshift('🛡️ Todas las tropas cayeron en el asalto.');
  }
}

function removePvpCasualty(category, pvp){
  const troop = TROOPS.find(t => t.id.startsWith(category) && (state.troops[t.id] || 0) > 0);
  if(!troop) return null;
  state.troops[troop.id]--;
  if(!pvp.lostByTroop) pvp.lostByTroop = {};
  pvp.lostByTroop[troop.id] = (pvp.lostByTroop[troop.id] || 0) + 1;
  return troop.id;
}

function recoverPvpLosses(pvp){
  const recoveryPct = Math.min(0.5, getResearchPct('log_heal') / 100);
  if(recoveryPct <= 0 || !pvp.lostByTroop) return 0;
  let recovered = 0;
  Object.entries(pvp.lostByTroop).forEach(([troopId, lost]) => {
    const amount = Math.floor(lost * recoveryPct);
    if(amount > 0){
      state.troops[troopId] = (state.troops[troopId] || 0) + amount;
      recovered += amount;
    }
  });
  if(recovered > 0) pvp.logs.unshift(`💚 La recuperación salvó ${recovered} tropa(s) tras el combate.`);
  return recovered;
}

function tickPvpCombat(dt){
  const pvp = combatState.pvp;
  if(!pvp || !pvp.active) return;
  pvp.supportCd = Math.max(0, (pvp.supportCd || 0) - dt);

  pvp._step = (pvp._step || 0) + dt;
  if(pvp._step >= 1.5){
    pvp._step = 0;
    let myPower = 0;
    const attackMultiplier = 1 + Math.min(1, getResearchPct('army_atk') / 100);
    const lossReduction = Math.min(0.65, (getResearchPct('army_def') + getResearchPct('army_hp')) / 100);
    pvp.squads.forEach(sq => {
      if(sq.troops > 0){
        const mult = sq.heroDefeated ? 1 : 1.35;
        myPower += sq.troops * 0.35 * mult * attackMultiplier;
      }
    });

    pvp.enemyTroops = Math.max(0, pvp.enemyTroops - Math.max(1, Math.round(myPower)));

    // Daño enemigo repartido en categorías
    pvp.squads.forEach(sq => {
      if(sq.troops > 0){
        const loss = Math.min(sq.troops, Math.random() < 0.55 * (1 - lossReduction) ? 1 : 0);
        if(loss > 0){
          const lostTroopId = removePvpCasualty(sq.cat, pvp);
          if(!lostTroopId) return;
          sq.troops -= loss;

          // Si la categoría de su tropa desaparece por completo, el héroe hace animación de derrota pero la batalla continúa
          if(sq.troops <= 0 && !sq.heroDefeated){
            sq.heroDefeated = true;
            pvp.logs.unshift(`💔 ¡${sq.label} eliminada! ${sq.heroName} (${sq.heroRole}) muestra animación de derrota, pero la batalla continúa.`);
          }
        }
      }
    });

    checkPvpEnd();
  }
}

// === MOTOR DE AUDIO LIGERO (WEB AUDIO API) ===
const SoundEngine = (() => {
  let ctx = null;
  let muted = false;
  let bgmTimer = null;
  let stepIdx = 0;

  // Melodía suave y liviana estilo reino/aventura (en Hz)
  const melody = [
    261.63, 329.63, 392.00, 523.25,
    493.88, 392.00, 329.63, 392.00,
    293.66, 349.23, 440.00, 587.33,
    523.25, 440.00, 392.00, 329.63
  ];

  function ensureCtx(){
    if(muted) return null;
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
    }
    if(ctx.state === 'suspended'){
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  function tone(freq, duration, type = 'sine', vol = 0.06, delay = 0, slideTo = null){
    const c = ensureCtx();
    if(!c || muted) return;
    const now = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if(slideTo){
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), now + duration);
    }
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function startBgm(){
    if(muted || bgmTimer) return;
    ensureCtx();
    bgmTimer = setInterval(() => {
      if(muted || !ctx || ctx.state !== 'running') return;
      const n = melody[stepIdx % melody.length];
      tone(n, 0.34, 'triangle', 0.022, 0);
      if(stepIdx % 4 === 0){
        tone(n * 0.5, 0.55, 'sine', 0.018, 0);
      }
      stepIdx++;
    }, 460);
  }

  function stopBgm(){
    if(bgmTimer){
      clearInterval(bgmTimer);
      bgmTimer = null;
    }
  }

  function setMuted(m){
    muted = Boolean(m);
    if(state) state.audioMuted = muted;
    saveState();
    const btn = document.getElementById('audioToggleBtn');
    if(btn) btn.textContent = muted ? '🔇' : '🔊';
    if(muted) stopBgm();
    else startBgm();
  }

  function toggleMute(){
    setMuted(!muted);
    toast(muted ? '🔇 Audio silenciado' : '🔊 Música y sonidos activados');
  }

  function sfx(kind){
    if(muted) return;
    ensureCtx();
    if(kind === 'click') tone(520, 0.06, 'sine', 0.04, 0, 660);
    else if(kind === 'build'){
      tone(220, 0.11, 'triangle', 0.07, 0, 330);
      tone(330, 0.14, 'triangle', 0.07, 0.09, 440);
    }else if(kind === 'research'){
      tone(440, 0.12, 'sine', 0.06, 0, 587);
      tone(659, 0.18, 'sine', 0.06, 0.11, 880);
    }else if(kind === 'hit'){
      tone(160, 0.12, 'sawtooth', 0.055, 0, 75);
    }else if(kind === 'victory'){
      tone(523.25, 0.14, 'triangle', 0.07, 0);
      tone(659.25, 0.14, 'triangle', 0.07, 0.13);
      tone(783.99, 0.25, 'triangle', 0.08, 0.26);
    }else if(kind === 'error'){
      tone(210, 0.12, 'sawtooth', 0.04, 0, 150);
    }
  }

  return {
    initFromState: () => {
      muted = !(state && state.audioMuted === false);   // apagado por defecto hasta que el jugador lo active
      const btn = document.getElementById('audioToggleBtn');
      if(btn) btn.textContent = muted ? '🔇' : '🔊';
      if(!muted) startBgm();
    },
    unlock: () => {
      if(!muted) startBgm();
    },
    toggleMute,
    sfx
  };
})();

document.addEventListener('pointerdown', () => SoundEngine.unlock(), {passive:true});
const _audBtn = document.getElementById('audioToggleBtn');
if(_audBtn) _audBtn.addEventListener('click', () => SoundEngine.toggleMute());

const _origToast = toast;
toast = function(msg){
  if(typeof msg === 'string'){
    if(msg.includes('❌') || msg.includes('⚠️') || msg.includes('🔒')) SoundEngine.sfx('error');
    else if(msg.includes('🏆') || msg.includes('🎉') || msg.includes('🎁')) SoundEngine.sfx('victory');
    else if(msg.includes('🔬')) SoundEngine.sfx('research');
    else if(msg.includes('🏗️') || msg.includes('✅') || msg.includes('⚔️')) SoundEngine.sfx('build');
    else SoundEngine.sfx('click');
  }
  _origToast(msg);
};

(function boot(){
  const now = Date.now();
  const elapsed = Math.min(86400 * 7, Math.max(0, (now - (state.lastTick || now)) / 1000));
  const resBefore = {...state.res};
  const buildsBefore = state.buildQueues.filter(Boolean).length;
  const troopsBefore = getTotalTroops();
  if(elapsed > 0) advanceSimulation(elapsed, 0);
  centerOnCastle();
  renderMap();
  renderHUD();
  if(elapsed >= 120){
    const gains = {};
    RES.forEach(r => { gains[r.id] = (state.res[r.id] || 0) - (resBefore[r.id] || 0); });
    const builds = buildsBefore - state.buildQueues.filter(Boolean).length;
    const troops = getTotalTroops() - troopsBefore;
    if(builds > 0 || troops > 0 || RES.some(r => gains[r.id] >= 1)){
      offlineReport = {secs:elapsed, gains, builds, troops};
      openSheet('offline');
    }
  }
  SoundEngine.initFromState();
  saveState();

  // reloj real: usa el tiempo transcurrido de verdad, así el juego no se atrasa si el navegador frena los temporizadores
  let lastWall = Date.now();
  setInterval(() => {
    const wall = Date.now();
    const real = Math.min(86400 * 7, Math.max(0, (wall - lastWall) / 1000));
    lastWall = wall;
    if(DEBUG.speed > 1) state.clockOffsetMs = (state.clockOffsetMs || 0) + real * 1000 * (DEBUG.speed - 1);
    advanceSimulation(real * DEBUG.speed, Math.min(real, 2));
    updateBusyTags();
    renderHUD();
    if(selectedTechId) renderTechDetailModal();
    if(techScreenOpen) renderTechScreen();
  }, 1000);

  setInterval(saveState, 5000);
  window.addEventListener('beforeunload', saveState);
})();
</script>
