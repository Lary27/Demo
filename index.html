    return;
  }
  // El primer rival debe estar como máximo 10 puestos por encima del jugador
  const minRank = Math.max(1, myRank - 10);
  const candidates = [];
  for(let r = minRank; r < myRank; r++) candidates.push(r);
  // Mezclar candidatos cercanos
  for(let i = candidates.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  const picked = candidates.slice(0, 4).sort((a, b) => a - b);
  // Garantizar estrictamente que el primero esté <= 10 puestos arriba
  if(picked.length > 0 && (myRank - picked[0]) > 10){
    picked[0] = minRank;
  }
  for(let r = myRank + 1; picked.length < 4 && r <= 1000; r++) picked.push(r);
  col.rivals = picked;
  saveState();
  if(!silent){
    toast('🔄 Lista de 4 rivales actualizada');
    renderColiseumScreen();
  }
}

function getDailyRewardForRank(rank){
  return COLISEUM_DAILY_REWARDS.find(t => rank >= t.min && rank <= t.max) || COLISEUM_DAILY_REWARDS[COLISEUM_DAILY_REWARDS.length - 1];
}

function claimColiseumDailyReward(){
  const col = ensureColiseumState();
  const list = col.pending || [];
  if(!list.length){ toast('✅ Sin recompensas pendientes. Se entregan al cierre diario (00:00)'); return; }
  const total = list.reduce((a, x) => a + x.gems, 0);
  col.pending = [];
  state.gems = (state.gems || 0) + total;
  saveState(); renderHUD();
  toast(`🏆 Recompensa del Coliseo: +${total} 💎`);
  renderColiseumScreen();
}

function getColiseumUnitPower(heroId, lv, evo){
  const st = getHeroStats(heroId, lv, evo);
  return Math.round(st.atk * 3.2 + st.def * 2.5 + st.hp * 0.45);
}

function spawnBattleSide(heroIds, side, customLv = null, customEvo = null){
    const count = heroIds.length;
    return heroIds.map((hid, idx) => {
      const st = getHeroStats(hid, customLv, customEvo);
      const yStep = 100 / (count + 1);
      return {
        uid: `${side}_${idx}_${hid}`,
        side,
        heroId: st.id,
        name: st.name,
        role: st.role,
        ico: st.ico,
        color: st.color,
        lv: st.lv,
        range: st.range,
        maxHp: st.hp,
        hp: st.hp,
        atk: st.atk,
        def: st.def,
        baseSpd: st.spd,
        energy: 25,
        shield: 0,
        stunTimer: 0,
        slowTimer: 0,
        rageTimer: 0,
        magicBonus: 0,
        basicCount: 0,
        passiveShieldUsed: false,
        cd1: 1.4 + idx * 0.35,
        cd2: 2.8 + idx * 0.4,
        atkTimer: 0.4 + idx * 0.15,
        x: side === 'ally' ? 14 : 86,
        y: Math.round(yStep * (idx + 1)),
        anim: '',
        fxText: '',
        dmgDealt: 0,
        healingDone: 0,
        skillsUsed: []
      };
    });
}

function startColiseumBattle(rivalRank){
  const col = ensureColiseumState();
  const activeIds = getActiveColiseumSquad();
  if(activeIds.length === 0){
    toast('⚠️ Selecciona al menos 1 héroe en tu escuadrón del Coliseo');
    coliseumUI.tab = 'squad';
    renderColiseumScreen();
    return;
  }
  const rival = getRankingEntryByRank(rivalRank);
  if(!rival) return;

  // Cada ataque (bot o jugador) consume intentos del Coliseo; se reinician a las 00:00 hora de Perú
  if(col.dailyAttemptsLeft < CONFIG.coliseumAttemptCost){
    toast('⏳ Sin intentos hoy. Se reinician a las 00:00 (hora de Perú)');
    return;
  }
  col.dailyAttemptsLeft -= CONFIG.coliseumAttemptCost;
  saveState();

  const spawnSide = spawnBattleSide;

  const allies = spawnSide(activeIds, 'ally', null);
  const enemies = spawnSide(rival.squad, 'enemy', rival.heroLv || 1, rival.heroEvo || 0);

  coliseumUI.battle = {
    active: true,
    finished: false,
    won: null,
    elapsed: 0,
    maxDuration: 60,
    rivalRank: rival.rank,
    rivalName: rival.name,
    rivalIsBot: !!rival.isBot,
    rivalAvatar: avatarOfEntry(rival),
    units: [...allies, ...enemies],
    floats: [],
    banner: `⚔️ ¡Inicia el duelo contra ${rival.name} (Puesto #${rival.rank})!`,
    events: [`0.0s · Inicio del combate vs ${rival.name} (#${rival.rank})`],
    rewardSummary: ''
  };
  coliseumUI.tab = 'arena';
  renderColiseumScreen();
}

function addBattleFloat(b, x, y, text, color = '#fff'){
  b.floats.push({id: Math.random(), x, y, text, color, ttl: 0.85});
  if(b.floats.length > 14) b.floats.shift();
}

function logColiseumEvent(b, text){
  const t = `${b.elapsed.toFixed(1)}s · ${text}`;
  b.banner = text;
  b.events.unshift(t);
  if(b.events.length > 40) b.events.pop();
}

function dealColiseumDamage(b, attacker, target, rawDmg, opts = {}){
  if(!target || target.hp <= 0) return 0;
  if(target.dodge > 0){ addBattleFloat(b, target.x, target.y - 4, '💨 Esquiva', '#c4b5fd'); return 0; }
  if(attacker.weakTimer > 0) rawDmg *= 0.8;
  const defFactor = opts.ignoreDef ? 0.7 : 1.0;
  const effDef = target.def * defFactor;
  const magicMult = 1 + (attacker.magicBonus || 0);
  let dmg = Math.max(8, Math.round((rawDmg * magicMult) * (100 / (100 + effDef * 1.35))));

  if(target.heroId === 'arthur') dmg = Math.round(dmg * (target.hp <= target.maxHp * 0.5 ? 0.8 : 0.88));
  target.hitT = 0.3;
  if(target.shield > 0){
    const abs = Math.min(target.shield, dmg);
    target.shield -= abs;
    dmg -= abs;
    if(abs > 0) addBattleFloat(b, target.x, target.y - 8, `🛡️-${abs}`, '#93c5fd');
  }
  target.hp = Math.max(0, target.hp - dmg);
  attacker.dmgDealt += dmg;
  target.energy = Math.min(100, target.energy + 9);
  if(dmg > 0){
    addBattleFloat(b, target.x, target.y - 4, `${opts.crit ? '💥' : '-'}${dmg}`, opts.crit ? '#fde047' : '#fca5a5');
  }

  // Pasiva Arthur: escudo al caer bajo 50% HP
  if(target.heroId === 'arthur' && !target.passiveShieldUsed && target.hp > 0 && target.hp <= target.maxHp * 0.5){
    target.passiveShieldUsed = true;
    const sh = Math.round(target.maxHp * 0.22);
    target.shield += sh;
    target.fxText = '🛡️ Voluntad';
    logColiseumEvent(b, `🛡️ Pasiva de Arthur activada (+${sh} Escudo)`);
  }

  if(target.hp <= 0){
    target.fxText = '💀 Caído';
    logColiseumEvent(b, `💀 ${target.name} (${target.side === 'ally' ? 'Aliado' : 'Rival'}) ha sido derrotado`);
  }
  return dmg;
}

function tickColiseumBattle(dt){
  const b = coliseumUI.battle;
  if(!b || !b.active || b.finished) return;

  b.elapsed += dt;
  b.floats.forEach(f => f.ttl -= dt);
  if(b.ultFx){ b.ultFx.ttl -= dt; if(b.ultFx.ttl <= 0) b.ultFx = null; }
  b.floats = b.floats.filter(f => f.ttl > 0);

  const allies = b.units.filter(u => u.side === 'ally' && u.hp > 0);
  const enemies = b.units.filter(u => u.side === 'enemy' && u.hp > 0);

  if(allies.length === 0 || enemies.length === 0 || b.elapsed >= b.maxDuration){
    finishColiseumBattle(allies.length > 0 && enemies.length === 0);
    return;
  }

  b.units.forEach(u => {
    if(u.hp <= 0) return;
    u.cd1 = Math.max(0, u.cd1 - dt);
    u.cd2 = Math.max(0, u.cd2 - dt);
    if(u.stunTimer > 0) u.stunTimer = Math.max(0, u.stunTimer - dt);
    if(u.slowTimer > 0) u.slowTimer = Math.max(0, u.slowTimer - dt);
    if(u.rageTimer > 0) u.rageTimer = Math.max(0, u.rageTimer - dt);
    if(u.weakTimer > 0) u.weakTimer = Math.max(0, u.weakTimer - dt);
    if(u.hitT > 0) u.hitT = Math.max(0, u.hitT - dt);
    if(u.dodge > 0){
      u.dodge -= dt; u.fxText = '💨 Esquiva';
      if(u.dodge <= 0){
        u.dodge = 0;
        const ft = b.units.filter(x => x.side !== u.side && x.hp > 0).sort((a, c) => Math.hypot(a.x - u.x, a.y - u.y) - Math.hypot(c.x - u.x, c.y - u.y))[0];
        if(ft){ dealColiseumDamage(b, u, ft, u.atk * getHeroById(u.heroId).s2.mult, {crit:true}); u.rageTimer = 2; logColiseumEvent(b, `⚡ ${u.name} contraataca tras esquivar`); }
      }
      return;
    }

    if(u.stunTimer > 0){
      u.fxText = '💫 Aturdido';
      return;
    }else if(u.slowTimer > 0){
      u.fxText = '❄️ Lento';
    }else if(u.shield > 0){
      u.fxText = `🛡️ ${u.shield}`;
    }else if(u.rageTimer > 0){
      u.fxText = '⚡ Furia';
    }else{
      u.fxText = '';
    }

    const foes = b.units.filter(x => x.side !== u.side && x.hp > 0);
    const friends = b.units.filter(x => x.side === u.side && x.hp > 0);
    if(foes.length === 0) return;

    // Elegir objetivo más cercano
    foes.sort((a, c) => Math.hypot(a.x - u.x, a.y - u.y) - Math.hypot(c.x - u.x, c.y - u.y));
    const target = foes[0];
    const distPx = Math.hypot((target.x - u.x) * 3.4, (target.y - u.y) * 2.2);

    // Movimiento hacia rango de ataque
    if(distPx > u.range * 0.42){
      const dirX = u.side === 'ally' ? 1 : -1;
      const moveStep = (u.range < 100 ? 18 : 10) * dt * (u.heroId === 'alice' ? 1.25 : 1) * (u.slowTimer > 0 ? 0.7 : 1);
      u.x = Math.max(10, Math.min(90, u.x + dirX * moveStep));
      const dy = target.y - u.y;
      u.y += Math.sign(dy) * Math.min(Math.abs(dy), 12 * dt);
      return;
    }

    const heroCfg = getHeroById(u.heroId);

    // 1. Habilidad Definitiva (100 Energía)
    if(u.energy >= 100){
      u.energy = 0;
      u.anim = 'ulting';
      setTimeout(() => { u.anim = ''; }, 350);
      u.skillsUsed.push(heroCfg.ult.name);
      b.ultFx = {ico:heroArt(u.heroId), name:heroCfg.ult.name, hero:u.name, ttl:1.3};
      if(u.heroId === 'krixi') u.magicBonus = Math.min(0.4, u.magicBonus + 0.08);

      if(heroCfg.ult.zone){
        foes.forEach(f => { dealColiseumDamage(b, u, f, u.atk * heroCfg.ult.mult); f.slowTimer = Math.max(f.slowTimer, heroCfg.ult.slow); f.weakTimer = heroCfg.ult.weak; });
        logColiseumEvent(b, `🌌 ${u.name} abre ${heroCfg.ult.name}: enemigos lentos y debilitados`);
      }else if(heroCfg.ult.healMult){
        const healAmt = Math.round(u.atk * heroCfg.ult.healMult);
        friends.forEach(f => {
          f.hp = Math.min(f.maxHp, f.hp + healAmt);
          f.shield += Math.round(f.maxHp * (heroCfg.ult.shieldPct || 0.15));
          u.healingDone += healAmt;
          addBattleFloat(b, f.x, f.y - 6, `+${healAmt}💚`, '#4ade80');
        });
        logColiseumEvent(b, `🌟 ${u.name} usa DEF: ${heroCfg.ult.name} (Cura + Escudo grupal)`);
      }else if(heroCfg.ult.aoe){
        foes.forEach(f => { dealColiseumDamage(b, u, f, u.atk * heroCfg.ult.mult, {crit:true}); if(heroCfg.ult.stun) f.stunTimer = Math.max(f.stunTimer, heroCfg.ult.stun); });
        logColiseumEvent(b, `🌟 ${u.name} desata DEF en área: ${heroCfg.ult.name}`);
      }else{
        const hits = heroCfg.ult.hits || 1;
        for(let i = 0; i < hits; i++) dealColiseumDamage(b, u, target, u.atk * heroCfg.ult.mult / hits, {crit:true});
        if(heroCfg.ult.stun) target.stunTimer = Math.max(target.stunTimer, heroCfg.ult.stun);
        logColiseumEvent(b, `🌟 ${u.name} ejecuta DEF: ${heroCfg.ult.name} sobre ${target.name}`);
      }
      return;
    }

    // 2. Habilidad Normal 2
    if(u.cd2 <= 0){
      u.cd2 = heroCfg.s2.cd;
      u.energy = Math.min(100, u.energy + 22);
      u.anim = 'acting';
      setTimeout(() => { u.anim = ''; }, 240);
      u.skillsUsed.push(heroCfg.s2.name);
      if(u.heroId === 'krixi') u.magicBonus = Math.min(0.4, u.magicBonus + 0.08);

      if(heroCfg.s2.teamShield){
        friends.forEach(f => {
          const sh = Math.round(f.maxHp * (heroCfg.s2.shieldPct || 0.14));
          f.shield += sh;
          addBattleFloat(b, f.x, f.y - 6, `+${sh}🛡️`, '#60a5fa');
        });
      }
      if(heroCfg.s2.dodge){ u.dodge = heroCfg.s2.dodge; }
      else if(heroCfg.s2.aoeNear){
        foes.filter(f => Math.hypot((f.x - u.x) * 3.4, (f.y - u.y) * 2.2) < 95).forEach(f => { dealColiseumDamage(b, u, f, u.atk * heroCfg.s2.mult); if(heroCfg.s2.slow) f.slowTimer = Math.max(f.slowTimer, heroCfg.s2.slow); });
      }else if(heroCfg.s2.mult){
        dealColiseumDamage(b, u, target, u.atk * heroCfg.s2.mult);
      }
      if(heroCfg.s2.lift) addBattleFloat(b, target.x, target.y - 10, '⬆️', '#f9a8d4');
      if(heroCfg.s2.slow) target.slowTimer = Math.max(target.slowTimer, heroCfg.s2.slow);
      if(heroCfg.s2.stun) target.stunTimer = Math.max(target.stunTimer, heroCfg.s2.stun);
      logColiseumEvent(b, `✨ ${u.name} lanza ${heroCfg.s2.name}`);
      return;
    }

    // 3. Habilidad Normal 1
    if(u.cd1 <= 0){
      u.cd1 = heroCfg.s1.cd;
      u.energy = Math.min(100, u.energy + 18);
      u.anim = 'acting';
      setTimeout(() => { u.anim = ''; }, 240);
      u.skillsUsed.push(heroCfg.s1.name);
      if(u.heroId === 'krixi') u.magicBonus = Math.min(0.4, u.magicBonus + 0.08);

      if(heroCfg.s1.roll){
        u.nextShot = heroCfg.s1.roll;
        u.x = Math.max(10, Math.min(90, u.x + (u.side === 'ally' ? -9 : 9)));
        logColiseumEvent(b, `🌀 ${u.name} rueda y potencia su siguiente disparo`);
      }else if(heroCfg.s1.healMult){
        const lowest = [...friends].sort((a, c) => (a.hp/a.maxHp) - (c.hp/c.maxHp))[0];
        const healAmt = Math.round(u.atk * heroCfg.s1.healMult);
        lowest.hp = Math.min(lowest.maxHp, lowest.hp + healAmt);
        u.healingDone += healAmt;
        addBattleFloat(b, lowest.x, lowest.y - 6, `+${healAmt}💚`, '#4ade80');
        logColiseumEvent(b, `💚 ${u.name} cura a ${lowest.name} (+${healAmt} HP)`);
      }else if(heroCfg.s1.aoe){
        foes.forEach(f => dealColiseumDamage(b, u, f, u.atk * heroCfg.s1.mult));
        logColiseumEvent(b, `🔮 ${u.name} lanza ${heroCfg.s1.name} en área`);
      }else{
        const chosen = heroCfg.s1.targetBack ? foes[foes.length - 1] : target;
        if(heroCfg.s1.charge){ u.x = chosen.x + (u.side === 'ally' ? -5 : 5); u.y = chosen.y; }
        dealColiseumDamage(b, u, chosen, u.atk * heroCfg.s1.mult);
        if(heroCfg.s1.stun) chosen.stunTimer = Math.max(chosen.stunTimer, heroCfg.s1.stun);
        if(heroCfg.s1.interrupt){ chosen.cd1 += 1.5; chosen.cd2 += 1.5; chosen.energy = Math.max(0, chosen.energy - 20); }
        if(heroCfg.s1.shieldPct){
          u.shield += Math.round(u.maxHp * heroCfg.s1.shieldPct);
        }
        logColiseumEvent(b, `⚔️ ${u.name} usa ${heroCfg.s1.name} contra ${chosen.name}`);
      }
      return;
    }

    // 4. Ataque Básico
    const spdMult = (u.slowTimer > 0 ? 0.65 : 1) * (u.rageTimer > 0 ? 1.25 : 1);
    const interval = Math.max(0.45, 1.35 / (u.baseSpd * spdMult * (1 + 0.06 * (u.stacks || 0))));
    u.atkTimer -= dt;
    if(u.atkTimer <= 0){
      u.atkTimer = interval;
      u.basicCount++;
      u.energy = Math.min(100, u.energy + 14);
      u.anim = 'acting';
      setTimeout(() => { u.anim = ''; }, 160);

      const isCrit = Math.random() < (u.heroId === 'nakroth' || u.heroId === 'violet' ? 0.28 : 0.14);
      if(isCrit && u.heroId === 'nakroth') u.rageTimer = 2.0;

      let mult = isCrit ? 1.5 : 1.0;
      if(u.nextShot){ mult *= u.nextShot; u.nextShot = 0; }
      if(u.heroId === 'nakroth'){ if(u.lastT === target.uid) u.combo = Math.min(5, (u.combo || 0) + 1); else { u.lastT = target.uid; u.combo = 0; } mult *= 1 + 0.07 * u.combo; }
      if(u.heroId === 'violet') u.stacks = Math.min(5, (u.stacks || 0) + 1);
      dealColiseumDamage(b, u, target, u.atk * mult, {crit: isCrit});
    }
  });
}

function finishColiseumBattle(playerWon){
  const b = coliseumUI.battle;
  if(!b || b.finished) return;
  b.active = false;
  b.finished = true;
  b.won = !!playerWon;
  if(b.mode === 'adventure'){ finishAdventureBattle(playerWon); return; }

  const col = ensureColiseumState();
  const prevRank = col.rank;
  let newRank = prevRank;
  let rewardText = '';

  if(playerWon){
    // Actualizar puesto si el rival estaba por encima
    if(b.rivalRank < prevRank){
      const displacedBot = col.bots.find(bot => bot.rank === b.rivalRank);
      if(displacedBot) displacedBot.rank = prevRank;
      col.rank = b.rivalRank;
      newRank = col.rank;
    }
    col.score += 25;
    state.gems = (state.gems || 0) + 12;

    // Otorgar XP a los héroes participantes
    const allies = b.units.filter(u => u.side === 'ally');
    allies.forEach(a => grantHeroXp(a.heroId, 30));

    rewardText = `+12 💎 · +30 XP/héroe${newRank < prevRank ? ` · ¡Ascendiste al Puesto #${newRank}!` : ''}`;
    refreshColiseumRivals(true);
  }else{
    col.score = Math.max(800, col.score - 8);
    const allies = b.units.filter(u => u.side === 'ally');
    allies.forEach(a => grantHeroXp(a.heroId, 10));
    rewardText = `Sin cambio de puesto (#${prevRank}) · +10 XP de entrenamiento`;
  }

  b.rewardSummary = rewardText;
  logColiseumEvent(b, playerWon ? `🏆 ¡VICTORIA! ${rewardText}` : `💀 DERROTA. ${rewardText}`);

  const report = {
    id: `rep_${Date.now()}`,
    date: new Date(gameNow()).toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}),
    rivalAvatar: b.rivalAvatar, rivalIsBot: b.rivalIsBot,
    won: !!playerWon,
    rivalName: b.rivalName,
    rivalRank: b.rivalRank,
    prevRank,
    newRank,
    duration: b.elapsed.toFixed(1),
    rewardSummary: rewardText,
    allies: b.units.filter(u => u.side === 'ally').map(u => ({
      name: u.name, ico: u.ico, role: u.role, lv: u.lv,
      hpLeft: u.hp, maxHp: u.maxHp, dmgDealt: u.dmgDealt,
      healingDone: u.healingDone, skillsUsed: u.skillsUsed.length
    })),
    enemies: b.units.filter(u => u.side === 'enemy').map(u => ({
      name: u.name, ico: u.ico, role: u.role, lv: u.lv,
      hpLeft: u.hp, maxHp: u.maxHp, dmgDealt: u.dmgDealt,
      skillsUsed: u.skillsUsed.length
    })),
    events: b.events.slice(0, 30)
  };
  col.history.unshift(report);
  if(col.history.length > 30) col.history.pop();
  coliseumUI.selectedHistoryId = report.id;

  saveState();
  renderHUD();
  renderColiseumScreen();
}

function openColiseumScreen(initialTab = null){
  if(!isColiseumBuilt()){ toast(`🔒 Construye el Coliseo (Castillo Nv. ${CONFIG.coliseumUnlockCastle})`); return; }
  ensureColiseumState();
  closeSheet();
  if(initialTab) coliseumUI.tab = initialTab;
  coliseumUI.open = true;
  const el = $('#coliseumScreen');
  if(el) el.classList.add('open');
  renderColiseumScreen();
}

function closeColiseumScreen(){
  coliseumUI.open = false;
  const el = $('#coliseumScreen');
  if(el) el.classList.remove('open');
  renderHUD();
}

  const today = todayKeyStr();
  const rewardTier = getDailyRewardForRank(col.rank);
  const canClaimDaily = (col.pending || []).length > 0;
  const pendTotal = (col.pending || []).reduce((a, x) => a + x.gems, 0);

  const gemsEl = $('#colScreenGems');
  if(gemsEl) gemsEl.textContent = fmtNum(state.gems || 0);

  const bannerEl = $('#colPlayerBanner');
  if(bannerEl){
    bannerEl.innerHTML = `
      <div>
        <div style="font-weight:900;font-size:13.5px;color:#fff4dc">👑 ${col.playerName} · Castillo Nv.${cLv}</div>
        <div class="col-stats-pills">
          <span class="col-pill">Puesto: <b>#${col.rank}</b>/1000</span>
          <span class="col-pill">Puntos: <b>${col.score}</b></span>
          <span class="col-pill">Intentos: <b>${col.dailyAttemptsLeft}/5</b></span>
          <span class="col-pill">Espacios: <b>${activeSquad.length}/${unlockedSlots}</b></span>
        </div>

function getTroopCountByCat(cat){
  const t = state.troops || {};
  if(cat === 'infantry') return (t.infantry || 0) + (t.infantry2 || 0) + (t.infantry3 || 0) + (t.infantry4 || 0) + (t.infantry5 || 0);
  if(cat === 'cavalry') return (t.cavalry || 0) + (t.cavalry2 || 0) + (t.cavalry3 || 0) + (t.cavalry4 || 0) + (t.cavalry5 || 0);
  if(cat === 'artillery') return (t.artillery || 0) + (t.artillery2 || 0) + (t.artillery3 || 0) + (t.artillery4 || 0) + (t.artillery5 || 0);
  if(cat === 'siege') return (t.siege || 0) + (t.siege2 || 0) + (t.siege3 || 0) + (t.siege4 || 0) + (t.siege5 || 0);
  return 0;
}

// Modo 2: Ataque a Jugador (PvP con Tropas + Héroes de Apoyo)
function startPvpBattle(targetIdx){
  ensureHeroState();
  const target = PVP_TARGETS[targetIdx] || PVP_TARGETS[0];
  const cats = [
    {cat:'infantry',  label:'Infantería', ico:'🗡️'},
    {cat:'cavalry',   label:'Caballería', ico:'🐎'},
    {cat:'artillery', label:'Artillería', ico:'🎯'},
    {cat:'siege',     label:'Asedio',     ico:'🧱'}
  ];

  const squads = cats.map(c => {
    const count = getTroopCountByCat(c.cat);
    const heroId = state.heroes.assigned[c.cat];
    const hero = getHeroById(heroId);
    return {
      cat: c.cat,
      label: c.label,
      ico: c.ico,
      troops: count,
      maxTroops: count,
      heroName: hero.name,
      heroIco: hero.ico,
      heroRole: hero.role,
      heroDefeated: count <= 0,
      supportBuff: count > 0
    };
  });

  const enemyPower = Object.values(target.troops).reduce((a,b) => a + b, 0);

  combatState.pvp = {
    active: true,
    won: null,
    targetName: target.name,
    enemyTroops: enemyPower,
    maxEnemyTroops: enemyPower,
    reward: target.reward,
    squads,
    lostByTroop: {},
    supportCd: 0,
    logs: [`🏴 Marcha iniciada contra ${target.name}. Los héroes apoyan a sus tropas.`]
  };
}

function usePvpSupportSkill(){
  const pvp = combatState.pvp;
  if(!pvp || !pvp.active) return;
  if(pvp.supportCd > 0){
    toast('⏳ Apoyo en enfriamiento');
    return;
  }
  pvp.supportCd = 5;

  let activeSupporters = 0;
  let bonusDmg = 0;
  pvp.squads.forEach(sq => {
    if(sq.troops > 0 && !sq.heroDefeated){
      activeSupporters++;
      bonusDmg += Math.max(2, Math.round(sq.troops * 0.25));
      if(sq.cat === 'siege'){
        bonusDmg += 4;
      }
    }
  });

  pvp.enemyTroops = Math.max(0, pvp.enemyTroops - Math.max(3, bonusDmg));
  pvp.logs.unshift(`✨ Habilidades de apoyo activadas (${activeSupporters} héroes activos): -${Math.max(3, bonusDmg)} fuerzas enemigas.`);
  checkPvpEnd();
  renderHUD();
}

function checkPvpEnd(){
  const pvp = combatState.pvp;
  if(!pvp || !pvp.active) return;
  const totalMyTroops = pvp.squads.reduce((acc, s) => acc + s.troops, 0);
  if(pvp.enemyTroops <= 0){
    pvp.active = false;
    pvp.won = true;
    const cap = getMaxCap();
    RES.forEach(r => {
      if(pvp.reward[r.id]) state.res[r.id] = Math.min(cap, (state.res[r.id] || 0) + pvp.reward[r.id]);
    });
    state.gems = (state.gems || 0) + (pvp.reward.gems || 10);
    recoverPvpLosses(pvp);
    saveState();
    pvp.logs.unshift(`🏆 ¡Victoria en ${pvp.targetName}! Botín: +${pvp.reward.gems} 💎.`);
  }else if(totalMyTroops <= 0){
    pvp.active = false;
    pvp.won = false;
    recoverPvpLosses(pvp);
    saveState();
    pvp.logs.unshift('🛡️ Todas las tropas cayeron en el asalto.');
  }
}

function removePvpCasualty(category, pvp){
  const troop = TROOPS.find(t => t.id.startsWith(category) && (state.troops[t.id] || 0) > 0);
  if(!troop) return null;
  state.troops[troop.id]--;
  if(!pvp.lostByTroop) pvp.lostByTroop = {};
  pvp.lostByTroop[troop.id] = (pvp.lostByTroop[troop.id] || 0) + 1;
  return troop.id;
}

function recoverPvpLosses(pvp){
  const recoveryPct = Math.min(0.5, getResearchPct('log_heal') / 100);
  if(recoveryPct <= 0 || !pvp.lostByTroop) return 0;
  let recovered = 0;
  Object.entries(pvp.lostByTroop).forEach(([troopId, lost]) => {
    const amount = Math.floor(lost * recoveryPct);
    if(amount > 0){
      state.troops[troopId] = (state.troops[troopId] || 0) + amount;
      recovered += amount;
    }
  });
  if(recovered > 0) pvp.logs.unshift(`💚 La recuperación salvó ${recovered} tropa(s) tras el combate.`);
  return recovered;
}

function tickPvpCombat(dt){
  const pvp = combatState.pvp;
  if(!pvp || !pvp.active) return;
  pvp.supportCd = Math.max(0, (pvp.supportCd || 0) - dt);

  pvp._step = (pvp._step || 0) + dt;
  if(pvp._step >= 1.5){
    pvp._step = 0;
    let myPower = 0;
    const attackMultiplier = 1 + Math.min(1, getResearchPct('army_atk') / 100);
    const lossReduction = Math.min(0.65, (getResearchPct('army_def') + getResearchPct('army_hp')) / 100);
    pvp.squads.forEach(sq => {
      if(sq.troops > 0){
        const mult = sq.heroDefeated ? 1 : 1.35;
        myPower += sq.troops * 0.35 * mult * attackMultiplier;
      }
    });

    pvp.enemyTroops = Math.max(0, pvp.enemyTroops - Math.max(1, Math.round(myPower)));

    pvp.squads.forEach(sq => {
      if(sq.troops > 0){
        const loss = Math.min(sq.troops, Math.random() < 0.55 * (1 - lossReduction) ? 1 : 0);
        if(loss > 0){
          const lostTroopId = removePvpCasualty(sq.cat, pvp);
          if(!lostTroopId) return;
          sq.troops -= loss;

          if(sq.troops <= 0 && !sq.heroDefeated){
            sq.heroDefeated = true;
            pvp.logs.unshift(`💔 ¡${sq.label} eliminada! ${sq.heroName} (${sq.heroRole}) muestra animación de derrota, pero la batalla continúa.`);
          }
        }
      }
    });

    checkPvpEnd();
  }
}

  $('#sheet').innerHTML = `
    <div class="sh-head">

      <div>
        <h2>Modos de Combate</h2>
        <p>Coliseo Imperial de Héroes y Asaltos con Tropas</p>

    ${!isColiseumBuilt() ? '' : `<div class="info-box" style="border:1px solid rgba(217,155,56,.5);background:linear-gradient(180deg,rgba(92,53,24,.45),rgba(38,22,12,.6))">
      <div class="info-row"><span>🏟️ <b>Coliseo Imperial (Héroes)</b></span><span style="color:#ffd56b;font-weight:900">Puesto #${col.rank}</span></div>

      <button type="button" class="btn sm gold" style="margin-top:6px" onclick="openColiseumScreen('squad')">🏟️ Entrar al Coliseo y Héroes</button>
    </div>`}

    <div class="info-box">
      <div style="font-weight:900;font-size:12.5px;margin-bottom:4px">🏴 Ataque a Jugador (Tropas + Apoyo)</div>
      <div style="font-size:11.5px;color:var(--mute);margin-bottom:6px">Selecciona un objetivo rival para enviar tus tropas apoyadas por héroes:</div>
      <div class="grid2">
        ${PVP_TARGETS.map((t, i) => `<button type="button" class="btn sm gold" onclick="startPvpBattle(${i});renderHUD()">🏴 ${t.name} (${t.power})</button>`).join('')}
      </div>
    </div>

    ${pvp ? `
      <div class="arena-box">

        <div class="hp-bar enemy" style="margin-bottom:8px"><span style="width:${Math.max(0,Math.round(pvp.enemyTroops/Math.max(1,pvp.maxEnemyTroops)*100))}%"></span></div>

        <div class="pvp-squad-grid">
          ${pvp.squads.map(sq => `
            <div class="sq-card ${sq.heroDefeated ? 'gone' : ''}">
              <div class="f-top"><span>${sq.ico} ${sq.label}</span><b>${sq.troops}</b></div>
              <div style="margin-top:3px">${sq.heroIco} ${sq.heroName} (${sq.heroRole})</div>
              <div style="color:${sq.heroDefeated?'var(--bad)':'var(--ok)'};font-weight:800;margin-top:2px">
                ${sq.heroDefeated ? '💀 Derrota (batalla sigue)' : '✨ Apoyando tropa'}
              </div>
            </div>
          `).join('')}
        </div>

        <button type="button" class="btn sm ${pvp.active && pvp.supportCd<=0 ? 'gem' : 'dim'}" onclick="usePvpSupportSkill()">
          ${pvp.supportCd>0 ? `⏳ Apoyo de Héroes (${Math.ceil(pvp.supportCd)}s)` : '✨ Activar Habilidades de Apoyo a Tropas'}
        </button>

        <div class="combat-log">${pvp.logs.slice(0,5).map(l => `<div>${l}</div>`).join('')}</div>
      </div>
    ` : ''}
  `;
}

// === MOTOR DE AUDIO LIGERO (WEB AUDIO API) ===
const SoundEngine = (() => {
  let ctx = null;
  let muted = false;
  let bgmTimer = null;
  let stepIdx = 0;

  // Melodía suave y liviana estilo reino/aventura (en Hz)
  const melody = [
    261.63, 329.63, 392.00, 523.25,
    493.88, 392.00, 329.63, 392.00,
    293.66, 349.23, 440.00, 587.33,
    523.25, 440.00, 392.00, 329.63
  ];

  function ensureCtx(){
    if(muted) return null;
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
    }
    if(ctx.state === 'suspended'){
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  function tone(freq, duration, type = 'sine', vol = 0.06, delay = 0, slideTo = null){
    const c = ensureCtx();
    if(!c || muted) return;
    const now = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if(slideTo){
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), now + duration);
    }
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function startBgm(){
    if(muted || bgmTimer) return;
    ensureCtx();
    bgmTimer = setInterval(() => {
      if(muted || !ctx || ctx.state !== 'running') return;
      const n = melody[stepIdx % melody.length];
      tone(n, 0.34, 'triangle', 0.022, 0);
      if(stepIdx % 4 === 0){
        tone(n * 0.5, 0.55, 'sine', 0.018, 0);
      }
      stepIdx++;
    }, 460);
  }

  function stopBgm(){
    if(bgmTimer){
      clearInterval(bgmTimer);
      bgmTimer = null;
    }
  }

  function setMuted(m){
    muted = Boolean(m);
    if(state) state.audioMuted = muted;
    saveState();
    const btn = document.getElementById('audioToggleBtn');
    if(btn) btn.textContent = muted ? '🔇' : '🔊';
    if(muted) stopBgm();
    else startBgm();
  }

  function toggleMute(){
    setMuted(!muted);
    toast(muted ? '🔇 Audio silenciado' : '🔊 Música y sonidos activados');
  }

  function sfx(kind){
    if(muted) return;
    ensureCtx();
    if(kind === 'click') tone(520, 0.06, 'sine', 0.04, 0, 660);
    else if(kind === 'build'){
      tone(220, 0.11, 'triangle', 0.07, 0, 330);
      tone(330, 0.14, 'triangle', 0.07, 0.09, 440);
    }else if(kind === 'research'){
      tone(440, 0.12, 'sine', 0.06, 0, 587);
      tone(659, 0.18, 'sine', 0.06, 0.11, 880);
    }else if(kind === 'hit'){
      tone(160, 0.12, 'sawtooth', 0.055, 0, 75);
    }else if(kind === 'victory'){
      tone(523.25, 0.14, 'triangle', 0.07, 0);
      tone(659.25, 0.14, 'triangle', 0.07, 0.13);
      tone(783.99, 0.25, 'triangle', 0.08, 0.26);
    }else if(kind === 'error'){
      tone(210, 0.12, 'sawtooth', 0.04, 0, 150);
    }
  }

  return {
    initFromState: () => {
      muted = !(state && state.audioMuted === false);   // apagado por defecto hasta que el jugador lo active
      const btn = document.getElementById('audioToggleBtn');
      if(btn) btn.textContent = muted ? '🔇' : '🔊';
      if(!muted) startBgm();
    },
    unlock: () => {
      if(!muted) startBgm();
    },
    toggleMute,
    sfx
  };
})();

document.addEventListener('pointerdown', () => SoundEngine.unlock(), {passive:true});
const _audBtn = document.getElementById('audioToggleBtn');
if(_audBtn) _audBtn.addEventListener('click', () => SoundEngine.toggleMute());

const _origToast = toast;
toast = function(msg){
  if(typeof msg === 'string'){
    if(msg.includes('❌') || msg.includes('⚠️') || msg.includes('🔒')) SoundEngine.sfx('error');
    else if(msg.includes('🏆') || msg.includes('🎉') || msg.includes('🎁')) SoundEngine.sfx('victory');
    else if(msg.includes('🔬')) SoundEngine.sfx('research');
    else if(msg.includes('🏗️') || msg.includes('✅') || msg.includes('⚔️')) SoundEngine.sfx('build');
    else SoundEngine.sfx('click');
  }
  _origToast(msg);
};

(function boot(){
  const now = Date.now();
  const elapsed = Math.min(86400 * 7, Math.max(0, (now - (state.lastTick || now)) / 1000));
  const resBefore = {...state.res};
  const buildsBefore = state.buildQueues.filter(Boolean).length;
  const troopsBefore = getTotalTroops();
  if(elapsed > 0) advanceSimulation(elapsed, 0);
  centerOnCastle();
  renderMap();
  renderHUD();
  if(elapsed >= 120){
    const gains = {};
    RES.forEach(r => { gains[r.id] = (state.res[r.id] || 0) - (resBefore[r.id] || 0); });
    const builds = buildsBefore - state.buildQueues.filter(Boolean).length;
    const troops = getTotalTroops() - troopsBefore;
    if(builds > 0 || troops > 0 || RES.some(r => gains[r.id] >= 1)){
      offlineReport = {secs:elapsed, gains, builds, troops};
      openSheet('offline');
    }
  }
  const _colClose = document.getElementById('closeColiseumBtn');
  if(_colClose) _colClose.addEventListener('click', closeColiseumScreen);

  // Bucle fluido de 250ms para la arena visual del Coliseo
  setInterval(() => {
    if(coliseumUI.battle && coliseumUI.battle.active){
      tickColiseumBattle(0.25);
      if(coliseumUI.open && coliseumUI.tab === 'arena') renderColiseumScreen();
      if(adventureUI.open && adventureUI.view === 'battle') renderAdventureScreen();
    }
  }, 250);

  SoundEngine.initFromState();
  saveState();

  // reloj real: usa el tiempo transcurrido de verdad, así el juego no se atrasa si el navegador frena los temporizadores
  let lastWall = Date.now();
  setInterval(() => {
    const wall = Date.now();
    const real = Math.min(86400 * 7, Math.max(0, (wall - lastWall) / 1000));
    lastWall = wall;
    if(DEBUG.speed > 1) state.clockOffsetMs = (state.clockOffsetMs || 0) + real * 1000 * (DEBUG.speed - 1);
    advanceSimulation(real * DEBUG.speed, Math.min(real, 2));
    updateBusyTags();
    renderHUD();
    if(selectedTechId) renderTechDetailModal();
    if(techScreenOpen) renderTechScreen();
  }, 1000);

  setInterval(saveState, 5000);
  window.addEventListener('beforeunload', saveState);
})();
</script>
