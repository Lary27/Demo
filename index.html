<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1522">
<meta name="description" content="Construye, investiga y defiende tu reino en este prototipo estratégico.">
<title>Reino 4X — Edición mejorada</title>
<style>
:root{
  --bg:#0d1522;
  --panel:#172236;
  --panel2:#21314d;
  --ink:#f4f7ff;
  --mute:#9db0d4;
  --gold:#ffd166;
  --ok:#4ade80;
  --bad:#ff6b6b;
  --acc:#5b8cff;
  --gem:#5ce1e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

.top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,#1a2742,#10192b);padding:7px 10px;border-bottom:2px solid #080d18;z-index:10}
.brand{display:flex;align-items:center;gap:7px;font-weight:900;font-size:13px}
.brand-badge{background:rgba(255,209,102,.15);border:1px solid rgba(255,209,102,.45);color:var(--gold);padding:2px 7px;border-radius:8px;font-size:11px}
.top-right{display:flex;align-items:center;gap:6px}
.gem-pill{display:flex;align-items:center;gap:4px;background:rgba(92,225,230,.15);border:1px solid rgba(92,225,230,.45);color:var(--gem);padding:4px 9px;border-radius:99px;font-size:12px;font-weight:900}
.gem-pill b{color:#fff}
.shop-btn{background:linear-gradient(180deg,#f7be42,#d68914);border:1px solid #ffe399;color:#241400;padding:4px 9px;border-radius:10px;font-size:12px;font-weight:900;box-shadow:0 2px 0 #7b4a00}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#23422f 0%,#12241b 70%,#0b1410 100%)}

.queues-box{position:absolute;top:8px;left:8px;z-index:9;display:flex;flex-direction:column;gap:4px;width:min(194px,calc(100vw - 98px))}
.q-card{background:rgba(10,18,32,.9);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:5px 7px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.q-card.active-b{border-color:rgba(255,209,102,.75)}
.q-card.active-t{border-color:rgba(91,140,255,.75)}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:9px;font-weight:800;color:var(--mute);text-transform:uppercase}
.q-time{color:var(--gold);font-size:10px;font-variant-numeric:tabular-nums}
.q-txt{font-size:10.5px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-bar{height:3px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:3px}
.q-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .2s}
.q-card.active-t .q-bar span{background:linear-gradient(90deg,var(--acc),var(--gem))}

.right-hud{position:absolute;top:8px;right:8px;z-index:9;display:flex;flex-direction:column;gap:5px}
.side-btn{background:rgba(15,25,45,.92);border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;font-weight:800;color:var(--gold);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.side-btn span:first-child{font-size:16px;line-height:1}

.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab}
.viewport:active{cursor:grabbing}

/* === ESTILO ORGÁNICO Y VIVO DEL MAPA (SIN REJILLA DURA NI DISTANCIAS EXCESIVAS) === */
.world{
  position:absolute;
  left:0;top:0;
  width:1120px;
  height:1120px;
  padding:46px;
  border-radius:42px;
  background:
    radial-gradient(circle at 50% 50%, rgba(232,196,128,.22) 0%, rgba(168,136,82,.09) 28%, transparent 56%),
    radial-gradient(circle at 22% 24%, rgba(112,196,98,.26), transparent 42%),
    radial-gradient(circle at 78% 76%, rgba(64,158,186,.22), transparent 44%),
    linear-gradient(155deg,#2e632c 0%,#204a21 52%,#163519 100%);
  border:5px solid #488c42;
  box-shadow:0 24px 60px rgba(0,0,0,.72);
  transform-origin:0 0;
  will-change:transform;
}

.map{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(11, 1fr);
  grid-template-rows:repeat(11, 1fr);
  gap:0px;
}

.cell{
  position:relative;
  border-radius:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2px;
  font-size:25px;
  line-height:1;
  transition:transform .08s;
}
.cell:active{transform:scale(.95)}

/* Caminos orgánicos continuos y terreno natural integrado */
.cell.env-road{
  background:radial-gradient(circle at 50% 50%, rgba(214,178,122,.56), rgba(164,128,80,.42));
  border:0;
  border-radius:50%;
  box-shadow:0 0 8px rgba(196,160,106,.25);
  pointer-events:none;
}
.cell.env-nature{
  background:rgba(20,48,22,.14);
  border:0;
  border-radius:16px;
  font-size:23px;
  pointer-events:none;
}
.cell.env-water{
  background:radial-gradient(circle at 40% 35%,rgba(104,198,242,.58),rgba(28,108,164,.62));
  border:1px solid rgba(159,224,252,.32);
  border-radius:20px;
  font-size:21px;
  pointer-events:none;
}

/* Vida en el reino: personajes moviéndose por los caminos */
.life-layer{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
}
.walker{
  position:absolute;
  font-size:17px;
  line-height:1;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));
  transition:transform .05s linear;
}
.walker-tag{
  display:block;
  font-size:7.5px;
  font-weight:800;
  color:#fff;
  background:rgba(10,16,30,.72);
  padding:0 3px;
  border-radius:4px;
  text-align:center;
  margin-top:1px;
  white-space:nowrap;
}

/* Espacio construible: SIN fondo todo blanco, solo borde exterior ligeramente blanco */
.cell.blank-slot{
  background:rgba(255,255,255,.04);
  border:2px solid rgba(255,255,255,.52);
  box-shadow:0 0 0 1px rgba(255,255,255,.12), inset 0 0 10px rgba(255,255,255,.06);
}

.cell.ghost-slot{
  background:rgba(255,255,255,.05);
  border:2px dashed rgba(255,255,255,.46);
  box-shadow:inset 0 0 8px rgba(255,255,255,.05);
}
.cell.ghost-slot .ghost-ico{
  font-size:25px;
  opacity:.34;
  filter:grayscale(25%);
}

.cell.locked-slot{
  background:rgba(30,41,59,.55);
  border:2px solid rgba(148,163,184,.22);
  opacity:.72;
}
.cell.locked-slot .lk{font-size:15px;opacity:.75}

.cell.built{
  border:2px solid rgba(255,255,255,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.24)),var(--tile,#4a78a8);
  box-shadow:0 5px 12px rgba(0,0,0,.35);
}
.cell.castle{
  border:2.5px solid #fff2b2;
  background:linear-gradient(180deg,#ffe07d,#c98916);
  font-size:30px;
  box-shadow:0 0 18px rgba(255,209,102,.48);
}
.b-name{
  font-size:8.5px;
  font-weight:900;
  color:#fff;
  background:rgba(10,16,30,.75);
  padding:1px 4px;
  border-radius:5px;
  margin-top:3px;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.lv-tag{
  position:absolute;
  right:4px;
  bottom:4px;
  background:rgba(10,16,30,.92);
  color:#fff;
  border:1px solid rgba(255,255,255,.45);
  border-radius:99px;
  padding:1px 5px;
  font-size:9px;
  font-weight:900;
}
.busy-tag{
  position:absolute;
  left:50%;
  top:3px;
  transform:translateX(-50%);
  background:rgba(10,16,30,.94);
  color:var(--gold);
  border:1px solid var(--gold);
  border-radius:99px;
  padding:1px 6px;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}

.bottom-dock{background:linear-gradient(180deg,#142038,#0c1322);border-top:2px solid #080d18;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.res-dock{padding:6px 8px 5px;border-bottom:1px solid rgba(255,255,255,.08)}
.res-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin-bottom:4px;padding:0 2px}
.res-meta b{color:var(--gold)}
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.chip{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:4px;text-align:center;line-height:1.15}
.chip .top{display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:900}
.chip .rate{display:block;font-size:9.5px;color:var(--ok);font-weight:700;margin-top:1px}
.chip .bar{height:3px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-top:3px}
.chip .bar span{display:block;height:100%;width:0;transition:width .25s}

.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;padding:6px 8px 7px}
.nav button{position:relative;background:linear-gradient(var(--panel2),var(--panel));border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:6px 2px;font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #070c17}
.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #070c17}
.nav button .ico{font-size:17px;line-height:1}
.dot{display:none;position:absolute;top:-3px;right:3px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;background:var(--ok);color:#06210f;font-size:9.5px;font-weight:900;align-items:center;justify-content:center}
.dot.show{display:flex}

#sheetWrap{position:fixed;inset:0;z-index:25;display:none}
#sheetWrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(4,8,16,.68)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85dvh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.65)}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-head>div{flex:1;min-width:0}
.sh-head h2{margin:0;font-size:17px}
.sh-head h2 small{color:var(--gold);font-size:13px;margin-left:4px}
.sh-head p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.bigico{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.x{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);font-size:15px;flex:none}

.cat-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.cat-tab{padding:8px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);font-size:12px;font-weight:800;color:var(--mute)}
.cat-tab.active{background:rgba(91,140,255,.24);border-color:var(--acc);color:#fff}

.card{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.card.ready{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.08)}
.costs{display:flex;flex-wrap:wrap;gap:6px}
.cc{background:rgba(0,0,0,.35);border:1px solid transparent;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800}
.cc.lack{color:var(--bad);border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.15)}

.prereq-box{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35);color:#ffd2d2;border-radius:10px;padding:7px 9px;font-size:11.5px;font-weight:700}
.prereq-ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#bbf7d0;border-radius:10px;padding:7px 9px;font-size:11.5px;font-weight:700}

.btn{width:100%;border:0;border-radius:12px;padding:11px;font-size:13.5px;font-weight:900;color:#07210e;background:linear-gradient(180deg,#6ee79a,#2fbf65);box-shadow:0 3px 0 #18753c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #18753c}
.btn.dim{background:linear-gradient(180deg,#5b6582,#444d66);color:#cbd5e1;box-shadow:0 3px 0 #293044;opacity:.85}
.btn.gem{background:linear-gradient(180deg,#7df3f8,#26b3bd);color:#042429;box-shadow:0 3px 0 #136c73}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#e2a72e);color:#291900;box-shadow:0 3px 0 #8f6209}
.btn.danger{background:linear-gradient(180deg,#ff9494,#e04848);color:#290505;box-shadow:0 3px 0 #8c1e1e}
.btn.sm{padding:9px;font-size:12.5px}

.info-box{background:rgba(0,0,0,.26);border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:12.5px}
.info-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.info-row:last-child{border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tree-node{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px;margin-bottom:8px}
.tree-title{font-weight:900;font-size:13px;color:var(--gold)}
.tree-sub{font-size:11.5px;color:var(--mute);margin:2px 0 6px}

#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:35;background:rgba(8,12,22,.95);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:700;max-width:88vw;text-align:center;pointer-events:none;transition:.22s}
#toast.show{opacity:1;transform:translate(-50%,0)}

.hero-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:99px;background:rgba(91,140,255,.22);border:1px solid rgba(91,140,255,.5);color:#dce7ff}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mode-tab{padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.28);font-size:12px;font-weight:900;color:var(--mute)}
.mode-tab.active{background:linear-gradient(180deg,#5b8cff,#3962cc);border-color:#9ab6ff;color:#fff}

.arena-box{background:rgba(7,12,22,.72);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px;margin-bottom:10px}
.fighters-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.side-col{display:flex;flex-direction:column;gap:6px}
.fighter{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:7px;transition:transform .16s,opacity .3s,filter .3s}
.fighter.hit{transform:translateX(3px);border-color:var(--bad);background:rgba(255,107,107,.16)}
.fighter.crit-hit{transform:scale(1.03);border-color:var(--gold);background:rgba(255,209,102,.2)}
.fighter.defeated-anim{opacity:.42;filter:grayscale(85%);transform:translateY(4px) rotate(-2deg)}
.f-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:900}
.hp-bar{height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin-top:4px}
.hp-bar span{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width .2s}
.hp-bar.enemy span{background:linear-gradient(90deg,#ff8787,#e04848)}
.ult-mini{height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:3px}
.ult-mini span{display:block;height:100%;background:linear-gradient(90deg,#5ce1e6,#ffd166);transition:width .15s}
.vs-pill{font-size:12px;font-weight:900;color:var(--gold);background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.4);border-radius:99px;padding:4px 8px}

.skill-dock{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px;margin-top:8px}
.ult-bottom-wrap{margin-bottom:8px}
.ult-label{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--gem);margin-bottom:3px}
.ult-bottom-bar{height:9px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;border:1px solid rgba(92,225,230,.35)}
.ult-bottom-bar span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#5ce1e6,#ffd166);transition:width .15s}
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sk-btn{border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:7px 5px;background:linear-gradient(180deg,#253859,#172338);font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px}
.sk-btn.ult{border-color:rgba(255,209,102,.55);background:linear-gradient(180deg,#4a3614,#291d09);color:var(--gold)}
.sk-btn.ready{box-shadow:0 0 10px rgba(92,225,230,.35);border-color:var(--gem)}
.sk-btn.cd{opacity:.52;cursor:not-allowed}

.pvp-squad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.sq-card{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px;font-size:11px}
.sq-card.gone{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.1)}
.combat-log{max-height:92px;overflow:auto;background:rgba(0,0,0,.35);border-radius:10px;padding:7px;font-size:11px;color:var(--mute);line-height:1.35;margin-top:8px}


.bld-action-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.act-hex{background:linear-gradient(180deg,#234e49,#163632);border:1.5px solid #59b3a7;border-radius:14px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:900;color:#ecfdf5}
.act-hex span:first-child{font-size:20px}
.act-hex.main-up{background:linear-gradient(180deg,#2f6b57,#1c4537);border-color:#86efac}

.upgrade-panel{background:rgba(12,18,30,.88);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:11px;margin-top:8px}
.up-sec-title{font-size:12px;font-weight:900;color:var(--gold);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.up-effect-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}
.up-effect-row:last-child{border:0}
.up-delta{color:var(--ok);font-weight:900}
.req-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}
.req-line:last-child{border:0}
.req-ok{color:var(--ok);font-weight:900}
.req-no{color:var(--bad);font-weight:900}
.dual-action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}


.queues-drawer{
  position:absolute;
  top:8px;
  left:0;
  z-index:11;
  display:flex;
  align-items:flex-start;
  pointer-events:none;
}
.queues-panel{
  width:270px;
  max-width:calc(100vw - 54px);
  max-height:calc(100% - 16px);
  overflow:auto;
  background:rgba(21,29,26,.94);
  border:1.5px solid rgba(110,136,122,.45);
  border-left:0;
  border-radius:0 14px 14px 0;
  padding:8px;
  box-shadow:0 10px 26px rgba(0,0,0,.55);
  pointer-events:auto;
  transition:transform .22s ease, opacity .2s ease;
}
.queues-drawer.collapsed .queues-panel{
  display:none;
}
.drawer-toggle-btn{
  pointer-events:auto;
  margin-top:84px;
  width:26px;
  height:48px;
  background:rgba(21,29,26,.95);
  border:1.5px solid rgba(110,136,122,.55);
  border-left:0;
  border-radius:0 10px 10px 0;
  color:#e2e8f0;
  font-size:13px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:4px 4px 12px rgba(0,0,0,.45);
}
.qd-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}

/* Animación interna de cuarteles entrenando */

}
.drill-spark{

}
@keyframes barracksDrill{
  0%,100%{transform:translateX(0) rotate(0deg) scale(1)}
  25%{transform:translateX(-2.5px) rotate(-7deg) scale(1.06)}
  75%{transform:translateX(2.5px) rotate(7deg) scale(1.06)}
}
@keyframes sparkSpin{
  0%,100%{transform:scale(0.9);opacity:.75}
  50%{transform:scale(1.22);opacity:1}
}

/* Animación interna de productores de recursos trabajando */
.cell.producer-active .bld-main-ico{
  display: inline-block;
  animation: producerWork 1.05s ease-in-out infinite;
}
.prod-pulse{
  position:absolute;
  top:2px;
  left:3px;

}

}

}

/* Acabado visual y accesibilidad */
:root{
  --bg:#0b1220;
  --panel:#151f33;
  --panel2:#202e49;
  --ink:#f6f8ff;
  --mute:#b0bfd9;
  --gold:#f4c96b;
  --acc:#7298ff;
}
html,body{touch-action:auto}
#viewport{touch-action:none}
button:focus-visible{
  outline:3px solid #a5c4ff;
  outline-offset:2px;
}
.cell.built,.cell.castle,.cell.blank-slot,.cell.ghost-slot,.cell.locked-slot{
  border-radius:13px!important;
}
.cell.env-nature{
  color:#f1f5cf;
  text-shadow:0 3px 5px rgba(0,0,0,.7);
  background:radial-gradient(ellipse at 50% 85%,rgba(29,61,31,.4),transparent 72%);
}
.cell.env-nature span,.cell.env-water span{
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.42));
}
.cell.env-road{
  background:linear-gradient(180deg,rgba(176,145,92,.32),rgba(114,91,54,.28))!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:inset 0 1px rgba(255,235,190,.08)!important;
}
.cell.built{
  border-color:rgba(255,255,255,.48);
  box-shadow:0 4px 0 rgba(0,0,0,.38),0 9px 15px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.3);
}
.cell.castle{
  border-color:#fff0b1;

}
.cell.blank-slot{
  background:rgba(231,241,255,.075);
  border:1.5px solid rgba(223,235,255,.36);
}
.cell.ghost-slot{
  background:rgba(240,245,255,.055);
  border-color:rgba(223,235,255,.34);
}
.b-name{font-size:9px}
.walker{will-change:transform}
.locked-node{opacity:.72}
.locked-node .hex-badge{border-style:dashed}
.hex-node-btn:focus-visible .hex-badge{outline:3px solid #a5c4ff;outline-offset:2px}

.tb-btn{min-height:42px}
.td-card{max-height:90dvh;overflow:auto}
#toast{line-height:1.4}
@media (min-width:760px){
  .top-bar{padding:10px 18px}
  .brand{font-size:15px}
  .bottom-dock{padding-left:max(12px,calc((100vw - 900px)/2));padding-right:max(12px,calc((100vw - 900px)/2))}
  .res-dock{padding-top:9px}
  .nav{gap:8px;padding-top:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

.col-back{background:linear-gradient(180deg,#6e4324,#462814);border:1px solid #d4a34a;color:#ffecc7;border-radius:10px;padding:7px 11px;font-weight:900;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #1f1006}
.col-back:active{transform:translateY(1px)}
.col-title-wrap{text-align:center;flex:1;min-width:0}
.col-title-wrap h1{margin:0;font-size:15px;font-weight:900;color:#ffd97d;letter-spacing:.4px;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.col-title-wrap small{display:block;font-size:10.5px;color:#d6bea0;font-weight:700}
.col-player-banner{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;background:linear-gradient(90deg,rgba(201,151,62,.18),rgba(82,45,22,.35));border-bottom:1px solid rgba(201,151,62,.35);flex:none}
.col-stats-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.col-pill{background:rgba(20,12,7,.75);border:1px solid rgba(212,163,74,.45);border-radius:8px;padding:3px 7px;font-size:11px;font-weight:800;color:#ffe6b8}
.col-pill b{color:#ffd56b}
.col-subnav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px 10px;background:rgba(18,11,7,.85);border-bottom:1px solid rgba(201,151,62,.3);flex:none}
.col-tab-btn{background:linear-gradient(180deg,#3b2416,#24150c);border:1px solid rgba(201,151,62,.35);border-radius:10px;padding:7px 4px;color:#d9c2a3;font-size:11px;font-weight:900;cursor:pointer;text-align:center;position:relative}
.col-tab-btn.active{background:linear-gradient(180deg,#d99b38,#9c6619);border-color:#ffe49e;color:#1f1104;box-shadow:0 2px 8px rgba(217,155,56,.45)}
.col-tab-btn .col-badge{position:absolute;top:-4px;right:-3px;background:#ef4444;color:#fff;border-radius:99px;padding:1px 5px;font-size:9px;font-weight:900}
.col-body{flex:1;overflow-y:auto;padding:10px 12px 24px;-webkit-overflow-scrolling:touch}
.col-sec-title{font-size:12px;font-weight:900;color:#ffd573;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 8px;display:flex;align-items:center;justify-content:space-between}
.col-card{background:linear-gradient(180deg,rgba(56,35,21,.92),rgba(33,20,12,.95));border:1px solid rgba(201,151,62,.38);border-radius:13px;padding:10px;margin-bottom:9px;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.squad-slots-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.sq-slot{background:linear-gradient(180deg,#2e1c11,#1a0f08);border:2px dashed rgba(212,163,74,.45);border-radius:12px;padding:7px 3px;text-align:center;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.sq-slot.filled{border-style:solid;border-color:#e3af4b;background:linear-gradient(180deg,#4a2e1b,#29180d)}
.sq-slot.locked{border-style:solid;border-color:rgba(255,255,255,.15);background:rgba(15,10,7,.75);opacity:.65;cursor:not-allowed}
.sq-slot .slot-num{position:absolute;top:3px;left:5px;font-size:9px;font-weight:900;color:#c7a67b}
.sq-slot .slot-ico{font-size:24px;line-height:1.1}
.sq-slot .slot-nm{font-size:10px;font-weight:900;color:#fff2d6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sq-slot .slot-lv{font-size:9px;color:#ffd166;font-weight:800}
.hero-roster-grid{display:grid;grid-template-columns:1fr;gap:8px}
.hero-card-v4{background:linear-gradient(180deg,#3d2617,#24150c);border:1px solid rgba(212,163,74,.4);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:7px}
.hero-card-v4.in-squad{border-color:#4ade80;box-shadow:0 0 0 1px rgba(74,222,128,.35)}
.hc-top{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center}
.hc-portrait{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #d4a34a;box-shadow:inset 0 0 10px rgba(0,0,0,.5)}
.hc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(14,8,5,.6);border-radius:8px;padding:5px;font-size:10.5px;text-align:center}
.hc-stats span b{display:block;color:#ffd56b;font-size:11.5px}
.hc-skills{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;font-size:10px}
.hc-sk-pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:4px 6px;color:#ead7bc}
.hc-sk-pill b{color:#ffd97d;display:block;font-size:10.5px}
.rival-card{background:linear-gradient(180deg,#3d2416,#23140b);border:1px solid rgba(212,163,74,.45);border-radius:12px;padding:9px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:7px}
.rival-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rival-rank-badge{background:linear-gradient(180deg,#f59e0b,#b45309);color:#1d0d02;font-weight:900;font-size:11px;padding:3px 8px;border-radius:8px;white-space:nowrap}
.rival-team-row{display:flex;gap:5px;flex-wrap:wrap}
.rival-mini-hero{background:rgba(15,9,5,.7);border:1px solid rgba(212,163,74,.3);border-radius:8px;padding:3px 6px;font-size:10.5px;font-weight:800;color:#f5e3c6}
.col-btn{background:linear-gradient(180deg,#e0a33a,#a66c14);border:1px solid #ffe49e;color:#1f1104;border-radius:10px;padding:7px 11px;font-weight:900;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #4a2d05}
.col-btn:active{transform:translateY(1px)}
.col-btn.sec{background:linear-gradient(180deg,#4f3320,#301d11);border-color:#b88946;color:#f7e5c8;box-shadow:0 2px 0 #170d06}
.col-btn.danger{background:linear-gradient(180deg,#dc2626,#991b1b);border-color:#fca5a5;color:#fff;box-shadow:0 2px 0 #450a0a}
.col-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}

/* Arena Visual 2D */
.col-arena-stage{position:relative;height:265px;border-radius:14px;overflow:hidden;border:2px solid #d4a34a;background:
  radial-gradient(ellipse at 50% 35%,rgba(255,210,120,.22),transparent 60%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 38px),
  linear-gradient(180deg,#4a321e 0%,#755133 42%,#9e7348 43%,#6e4d2e 100%);
  box-shadow:inset 0 0 30px rgba(0,0,0,.65);margin-bottom:8px}
.col-arena-arch{position:absolute;top:0;left:0;right:0;height:42%;background:repeating-linear-gradient(90deg,#382314 0 28px,#26170c 28px 34px);border-bottom:3px solid #c9973e;display:flex;align-items:center;justify-content:space-around;padding:0 12px;opacity:.85}
.col-arena-arch span{font-size:18px;filter:drop-shadow(0 2px 3px #000)}
.col-arena-timer{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(18,10,5,.85);border:1px solid #d4a34a;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:900;color:#ffd97d;z-index:5}
.arena-unit{position:absolute;width:54px;transform:translate(-50%,-50%);transition:left .22s linear,top .22s linear,opacity .3s;text-align:center;z-index:3}
.arena-unit.dead{opacity:.22;filter:grayscale(1);transform:translate(-50%,-50%) scale(.85)}
.arena-unit.acting .au-sprite{transform:scale(1.22);filter:drop-shadow(0 0 8px #ffd700)}
.arena-unit.ulting .au-sprite{transform:scale(1.38);filter:drop-shadow(0 0 14px #ff6b00)}
.au-bars{background:rgba(12,7,4,.85);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:2px;margin-bottom:2px}
.au-hp{height:4px;background:#2b1515;border-radius:3px;overflow:hidden}
.au-hp i{display:block;height:100%;background:#4ade80;transition:width .18s}
.arena-unit.enemy .au-hp i{background:#f87171}
.au-en{height:3px;background:#1e293b;border-radius:3px;overflow:hidden;margin-top:1px}
.au-en i{display:block;height:100%;background:#facc15;transition:width .18s}
.au-sprite{width:36px;height:36px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #60a5fa;background:#1e293b;box-shadow:0 4px 6px rgba(0,0,0,.6);transition:transform .15s}
.arena-unit.enemy .au-sprite{border-color:#f87171;background:#3b1414}
.au-name{font-size:9px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
.au-fx{font-size:9px;font-weight:900;color:#fde047;text-shadow:0 1px 2px #000;min-height:11px}
.arena-float{position:absolute;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;animation:floatUp .85s ease-out forwards;z-index:6}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-26px)}}
.arena-fx-banner{position:absolute;bottom:6px;left:8px;right:8px;background:rgba(15,9,5,.82);border:1px solid rgba(212,163,74,.45);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:800;color:#ffe6b3;text-align:center;z-index:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;background:rgba(36,22,13,.85);border:1px solid rgba(201,151,62,.25);margin-bottom:5px;font-size:12px}
.rank-row.me{background:linear-gradient(90deg,rgba(217,155,56,.32),rgba(74,222,128,.16));border-color:#ffd56b}
.rank-num{font-weight:900;color:#ffd56b;text-align:center;font-size:12px}

.rank-row.rr{grid-template-columns:42px 34px 1fr auto}
.rank-row.top1{background:linear-gradient(90deg,#7a5a12,#2b1b08);border:2px solid #ffd54a;box-shadow:0 0 14px rgba(255,213,74,.45)}
.rank-row.top2{background:linear-gradient(90deg,#4b5563,#1f242b);border:2px solid #d1d5db}
.rank-row.top3{background:linear-gradient(90deg,#7c4a22,#2a1a0e);border:2px solid #d98b4a}
.av{width:32px;height:32px;border-radius:50% 50% 45% 45%;display:grid;place-items:center;background:radial-gradient(#6b4423,#2b180c);border:2px solid #c9973e;font-size:17px}
.tag{font-size:9px;font-weight:900;border-radius:6px 2px;padding:1px 5px;margin-left:4px}
.tag.bot{background:#374151;color:#d1d5db}.tag.real{background:#16a34a;color:#fff}.tag.me{background:#f59e0b;color:#1c1917}
.arena-unit.hit .au-sprite{filter:brightness(2.2) drop-shadow(0 0 8px #f87171)}
.ult-fx{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(255,140,0,.5),rgba(0,0,0,.6) 75%);color:#fff;font-weight:900;text-shadow:0 2px 8px #000}
.hist-row{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:14px 4px 14px 4px;background:rgba(36,22,13,.88);border-left:4px solid}
.hist-row.w{border-color:#4ade80}.hist-row.l{border-color:#f87171}

/* ===== Héroes, Fragmentos, reloj de Perú, Coliseo bloqueado ===== */
.peru-clock{font-size:10px;font-weight:900;color:#bfe3ff;font-variant-numeric:tabular-nums;white-space:nowrap}
.art{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;pointer-events:none}
.au-sprite .art,.slot-ico .art,.hs-ico .art,.hc-portrait .art,.bld-main-ico .art,.ghost-ico .art,.rival-mini-hero .art,.ult-fx .art,.sum-item .art,.sum-title .art,.btn .art,.frag-box .art{width:1.15em;height:1.15em;display:inline-block;vertical-align:middle}
.heroes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.hcard{position:relative;aspect-ratio:3/4;border-radius:12px;border:2px solid var(--rc,#9ca3af);background:var(--rbg,#333);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;box-shadow:0 0 10px var(--rglow,transparent);cursor:pointer}
.hcard .h-art{font-size:36px;width:58%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;line-height:1}
.hcard .h-art .art{width:100%;height:100%}
.hcard .h-role{position:absolute;top:3px;left:3px;font-size:8.5px;font-weight:900;background:rgba(0,0,0,.62);padding:1px 5px;border-radius:6px;color:#fff;z-index:2}
.hcard .h-up{position:absolute;top:2px;right:4px;color:#4ade80;font-size:17px;font-weight:900;text-shadow:0 0 4px #000;line-height:1;z-index:2}
.hcard .h-nm{font-size:11px;font-weight:900;margin-top:3px;text-shadow:0 1px 2px #000}
.hcard .h-lv{font-size:10px;color:#fff;font-weight:800}
.hcard .h-st{font-size:8px;color:#ffd166;letter-spacing:-1px;font-weight:900}
.hcard.locked{filter:grayscale(1) brightness(.65)}
.hcard.ssr{animation:ssrGlow 1.2s ease-in-out infinite alternate}
@keyframes ssrGlow{from{box-shadow:0 0 6px var(--rglow)}to{box-shadow:0 0 18px 4px var(--rc)}}
#heroModal,#infoModal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:14px}
#infoModal{z-index:70}
#heroModal.open,#infoModal.open{display:flex}
.hm-card{width:100%;max-width:420px;max-height:90dvh;overflow:auto;touch-action:pan-y;background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px}
.hm-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.hm-art{width:96px;flex:none;height:120px}
.frag-box{background:rgba(0,0,0,.28);border-radius:10px;padding:8px;margin-bottom:10px}
.frag-bar{height:9px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:5px 0}
.frag-bar span{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#5ce1e6)}
.hm-btns{display:flex;flex-direction:column;gap:7px}
#summonScreen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0%,#2a2250 0%,#12102a 70%,#0a0818 100%);padding-top:env(safe-area-inset-top)}
#summonScreen.open{display:flex}
.sum-top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(0,0,0,.35)}
.sum-items{display:flex;gap:8px;align-items:center;padding:8px 10px}
.sum-item{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 10px;font-size:15px}
.sum-item b{font-size:13px}
.sum-plus{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#f7be42,#d68914);border:1px solid #ffe399;color:#241400;font-weight:900;font-size:18px;line-height:1}
.sum-body{flex:1;overflow:auto;touch-action:pan-y;padding:6px 10px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sum-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px}
.sum-card.royal{border-color:#fbbf24;box-shadow:0 0 14px rgba(251,191,36,.25)}
.sum-title{font-weight:900;font-size:15px}.sum-title small{color:var(--mute);font-size:10.5px;margin-left:4px}
.sum-sub{font-size:11.5px;color:var(--mute);margin:2px 0 6px}
.sum-status{font-size:12px;font-weight:800;color:#bfe3ff;margin-bottom:4px;font-variant-numeric:tabular-nums}
.sum-pity{font-size:12px;font-weight:900;color:#fbbf24;margin-bottom:6px}
.sum-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-bigico{font-size:44px;line-height:1}
.goto-arrow{background:#f7be42;color:#241400;border:0;border-radius:6px;font-weight:900;padding:1px 7px;margin-left:4px}
.cell.coliseum-locked{opacity:.38;border-style:solid;border-color:rgba(255,255,255,.18);pointer-events:auto}
.cell.coliseum-locked .ghost-ico{font-size:30px;opacity:.55}
#tutorialLayer{position:fixed;inset:0;z-index:80;pointer-events:none;display:none}
#tutorialLayer.on{display:block}
.tut-dialog{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto;display:flex;gap:8px;align-items:flex-end}
.tut-guide{font-size:50px;width:66px;height:66px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border:2px solid var(--gold);border-radius:50%;overflow:hidden;flex:none}
.tut-box{flex:1;background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:10px 12px 18px;position:relative;min-height:84px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.tut-name{font-size:11px;font-weight:900;color:var(--gold)}
.tut-text{font-size:13px;line-height:1.35;margin-top:3px}
.tut-next{position:absolute;right:12px;bottom:3px;color:var(--gold);font-size:18px;animation:tutBob .7s infinite alternate}
@keyframes tutBob{to{transform:translateY(5px)}}
.tut-hint{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--gold);color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:99px;white-space:nowrap}
.cell.tut-target{outline:3px solid #ffd166;border-radius:12px;animation:tutPulse .9s infinite alternate;z-index:6}
@keyframes tutPulse{to{filter:brightness(1.6)}}
body.tut-lock .guide-bar,body.tut-lock .queues-drawer,body.tut-lock .right-hud,body.tut-lock .zoom-hud,body.tut-lock .realm-switch-btn{display:none!important}
body.tut-lock .top-bar{pointer-events:none}
body.tut-lock .dual-action-row .btn.gem{display:none}
body.tut-lock .dual-action-row{grid-template-columns:1fr}
body.tut-lock .cell.ghost-slot:not(.tut-target),body.tut-lock .cell.locked-slot,body.tut-lock .cell.coliseum-locked{visibility:hidden}
.right-hud #openBagsBtn{display:none}
#adventureScreen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0%,#1f3a2a 0%,#0f1d16 70%,#08110c 100%);padding-top:env(safe-area-inset-top)}
#adventureScreen.open{display:flex}
.adv-card.locked{opacity:.45}
.adv-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.adv-en{display:flex;gap:4px;font-size:24px}
.adv-en .art{width:1.1em;height:1.1em}
.hcard.picked{outline:3px solid #4ade80}
</style>

<body>
<div id="app">
  <header class="top-bar">
    <div class="brand" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div style="display:flex;align-items:center;gap:7px"><span>🏰 Reino 4X</span><span class="brand-badge">Castillo Nv.<b id="topCastleLv">1</b></span></div>
      <span class="peru-clock" id="peruClock" title="Hora de Perú (America/Lima)">🇵🇪 --:--:--</span>
    </div>
    <div class="top-right">
      <div class="gem-pill">💎 <b id="topGems">50</b></div>
      <button type="button" class="shop-btn" id="audioToggleBtn" style="background:linear-gradient(180deg,#4ade80,#16a34a);border-color:#bbf7d0;color:#052e16" title="Música y sonidos">🔊</button>
      <button type="button" class="shop-btn" id="openShopBtn">🛒 Tienda</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <aside class="queues-drawer collapsed" id="queuesDrawer">
      <div class="queues-panel" id="queuesPanelContent"></div>
      <button type="button" class="drawer-toggle-btn" id="drawerToggleBtn" title="Mostrar u ocultar filas">▶</button>
    </aside>

    <div class="right-hud">
      <button type="button" class="side-btn" id="centerCastleBtn" title="Centrar en Castillo">
        <span>🎯</span>
        <span>Centrar</span>
      </button>
      <button type="button" class="side-btn" id="openBagsBtn" title="Depósito de bolsas de recursos">
        <span>🎒</span>
        <span>Depósito</span>
      </button>
    </div>

    
    <div class="zoom-hud">
      <button type="button" class="zoom-btn" id="zoomInBtn" title="Acercar">+</button>
      <button type="button" class="zoom-btn" id="zoomOutBtn" title="Alejar">−</button>
      <button type="button" class="zoom-btn" id="zoomResetBtn" title="Restablecer zoom">1x</button>
    </div>

    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <div class="map" id="map"></div>
        <div class="life-layer" id="castleLifeLayer" aria-hidden="true"></div>
      </div>
    </div>
    <button type="button" class="realm-switch-btn" id="realmSwitchBtn" title="Cambiar entre Mapa del Castillo y Mapa del Reino">
      <span class="ico" id="realmSwitchIco">🌍</span>

/* ============================================================
   BASES DE DATOS CENTRALES (id interno fijo + texto/imagen editables)
   - id:    NUNCA cambia (se usa en partidas guardadas y en la lógica)
   - name:  texto visible; cámbialo libremente
   - image: ruta de imagen (null = usa el emoji `ico` como respaldo)
   Catálogos: BUILDINGS_DATA (edificios), HEROES_DATA (héroes),
              RESEARCH_DATA (investigaciones), ITEMS_DATA (objetos)
   ============================================================ */
const ITEMS_DATA = {
  evo_fragment: {id: 'evo_fragment', name: 'Fragmento de evolución', namePl: 'Fragmentos de evolución', ico: '🧩', image: null, desc: 'Fragmentos de un héroe. Sirven para evolucionarlo (hasta 10 evoluciones) o desbloquearlo.'},
  summon_leva:  {id: 'summon_leva',  name: 'Pergamino de Leva',      ico: '📜', image: null, desc: 'Invoca fragmentos y héroes de clase baja (Primera clase).'},
  summon_royal: {id: 'summon_royal', name: 'Estandarte Real',        ico: '⚜️', image: null, desc: 'Invoca fragmentos y héroes de nivel Épico o superior (Segunda clase). Garantiza un héroe SSR cada 30 giros.'},
  combat_book:  {id: 'combat_book',  name: 'Libro de guerra',        ico: '📕', image: null, desc: 'Solo funciona en el Salón de Combate (mejoras del edificio). Solo se consigue en la Tienda.'},
  valor_tome:   {id: 'valor_tome',   name: 'Tomo de Valor',          ico: '📖', image: null, desc: 'Da EXP a un héroe para subirlo de nivel (hasta el tope que permite el Castillo).'},
  gems:         {id: 'gems',         name: 'Diamantes',              ico: '💎', image: null, desc: 'Moneda premium: úsala en la tienda.'}
};

let heroesDirty = true;      // fuerza redibujar el panel de Héroes
let heroModalId = null;

/* ---------- Helpers de catálogo: TODA la UI lee nombre/imagen por ID ---------- */
function artHTML(e){
  if(!e) return '❔';
  const fb = e.ico || '❔';
  if(e.image) return `<img class="art" src="${e.image}" alt="" draggable="false" onerror="this.outerHTML='${fb}'">`;
  return fb;
}
function heroArt(id){ return artHTML(getHeroById(id)); }
function heroName(id){ return getHeroById(id).name; }
function bldArt(id){ return artHTML(BLD[id]); }
function bldName(id){ return (BLD[id] && BLD[id].name) || id; }
function itemArt(id){ return artHTML(ITEMS_DATA[id]); }
function itemName(id){ return (ITEMS_DATA[id] && ITEMS_DATA[id].name) || id; }
function itemNamePl(id){ return (ITEMS_DATA[id] && (ITEMS_DATA[id].namePl || ITEMS_DATA[id].name)) || id; }
function rarityOf(h){ return CONFIG.rarity[(h && h.rarity) || 'common'] || CONFIG.rarity.common; }
function rarityVars(key){
  const r = CONFIG.rarity[key] || CONFIG.rarity.common;
  return `--rc:${r.color};--rbg:${r.bg};--rglow:${r.glow};`;
}
function starsText(evo){ return '★'.repeat(evo) + '<span style="opacity:.3">' + '★'.repeat(Math.max(0, CONFIG.maxEvo - evo)) + '</span>'; }

/* ---------- Hora de Perú (Intl con timeZone 'America/Lima') ---------- */
const _limaFmt = new Intl.DateTimeFormat('en-CA', {timeZone: CONFIG.timezone, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'});
function limaParts(ms){
  const o = {};
  _limaFmt.formatToParts(new Date(ms)).forEach(x => { if(x.type !== 'literal') o[x.type] = x.value; });
  return {y: +o.year, mo: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second};
}
function limaDateKey(ms){
  const p = limaParts(ms);
  return `${p.y}-${String(p.mo).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`;
}
function limaSecondsToMidnight(){
  const p = limaParts(gameNow());
  return 86400 - (p.h * 3600 + p.mi * 60 + p.s);
}
function pad2(n){ return String(n).padStart(2, '0'); }
function fmtHMS(sec){
  sec = Math.max(0, Math.floor(sec));
  return `${pad2(Math.floor(sec / 3600))}:${pad2(Math.floor((sec % 3600) / 60))}:${pad2(sec % 60)}`;
}
function updatePeruClock(){
  const el = document.getElementById('peruClock');
  if(!el) return;
  const p = limaParts(gameNow());
  el.textContent = `🇵🇪 ${pad2(p.h)}:${pad2(p.mi)}:${pad2(p.s)}`;
}

/* ---------- Héroes: propiedad, nivel máximo, fragmentos y evolución ---------- */
function isHeroOwned(id){ ensureHeroState(); return hasBuiltType('soulforge') && state.heroes.unlocked.includes(id); }
function ownedHeroes(){ return HEROES.filter(h => isHeroOwned(h.id)); }
function heroLvCap(){
  const c = getCastleLv();
  if(c < CONFIG.forgeCastle) return 1;
  return Math.min(CONFIG.heroMaxLv, 10 + Math.round((c - CONFIG.forgeCastle) * 50 / (CONFIG.maxCastleLv - CONFIG.forgeCastle)));   // Nv10 en Castillo 6 -> Nv60 en Castillo 25
}

function addHeroFragments(id, qty){
  ensureHeroState();
  const r = state.heroRoster[id];
  const before = r.frags;
  r.frags = Math.min(CONFIG.maxFragments, r.frags + qty);
  let unlocked = false;
  if(!isHeroOwned(id) && r.frags >= CONFIG.heroUnlockFrags){
    state.heroes.unlocked.push(id);
    unlocked = true;
  }
  return {added: r.frags - before, unlocked};
}

function evolveHero(id){
  ensureHeroState();
  const r = state.heroRoster[id];
  if(!isHeroOwned(id)) return toast('🔒 Aún no tienes este héroe');
  if(r.evo >= CONFIG.maxEvo) return toast('⭐ Evolución máxima alcanzada');
  const cost = CONFIG.evoCost[r.evo];
  if(r.frags < cost) return toast(`🧩 Faltan ${cost - r.frags} fragmentos para la Evo ${r.evo + 1}`);
  r.frags -= cost;
  r.evo++;
  saveState();
  heroesDirty = true;
  toast(`⭐ ${heroName(id)} evolucionó a ★${r.evo}`);
  renderHeroModal();
  renderHUD();
}

/* ---------- Panel de Héroes (cuadrícula de 3 columnas) ---------- */
function renderHeroesSheet(){
  heroesDirty = false;
  ensureHeroState();
  const cap = heroLvCap();
  const cards = HEROES.map(h => {
    const r = state.heroRoster[h.id];
    const owned = isHeroOwned(h.id);
    const canUp = owned && r.lv < cap;
    return `
      <div class="hcard ${owned ? '' : 'locked'}" style="${rarityVars(h.rarity)}" onclick="openHeroModal('${h.id}')">
        <span class="h-role">${h.role}</span>
        ${canUp ? '<span class="h-up" title="Se puede mejorar">▲</span>' : ''}
        <div class="h-art">${heroArt(h.id)}</div>
        <div class="h-nm">${h.name}</div>
        ${owned
          ? `<div class="h-lv">Nv.${r.lv}</div><div class="h-st">${starsText(r.evo)}</div>`
          : `<div class="h-lv">🔒 ${r.frags}/${CONFIG.heroUnlockFrags} 🧩</div>`}
      </div>`;
  }).join('');
  $('#sheet').innerHTML = `
    <div class="sh-head">
      <div class="bigico" style="background:#7c3aed">🦸</div>
      <div><h2>Héroes</h2><p>Nivel máx. por Castillo Nv.${getCastleLv()}: <b>${cap}</b> · ▲ = puede mejorar</p></div>
      <button type="button" class="x" onclick="closeSheet()">✕</button>
    </div>
    <div class="heroes-grid">${cards}</div>
    <button type="button" class="btn gold" style="margin-top:12px" onclick="openSummonScreen()">${itemArt('evo_fragment')} Obtener ${itemNamePl('evo_fragment')}</button>`;
}

function openHeroModal(id){
  heroModalId = id;
  renderHeroModal();
  $('#heroModal').classList.add('open');
}
function closeHeroModal(){
  heroModalId = null;
  $('#heroModal').classList.remove('open');
}
function refreshHeroModal(){ if(heroModalId) renderHeroModal(); }

function renderHeroModal(){
  if(!heroModalId) return;
  ensureHeroState();
  const id = heroModalId, h = getHeroById(id), st = getHeroStats(id), r = state.heroRoster[id];
  const owned = isHeroOwned(id), cap = heroLvCap(), rar = rarityOf(h);
  const maxed = r.evo >= CONFIG.maxEvo;
  const need = owned ? (maxed ? CONFIG.maxFragments : CONFIG.evoCost[r.evo]) : CONFIG.heroUnlockFrags;
  const pct = Math.min(100, Math.round((r.frags / Math.max(1, need)) * 100));
  const can = owned && !maxed && r.frags >= need;
  const label = !owned ? `Desbloqueo del héroe` : (maxed ? `Evolución máxima ★${CONFIG.maxEvo}` : `Siguiente: Evolución ${r.evo + 1}`);
  $('#heroModalCard').innerHTML = `
    <div class="hm-top" style="${rarityVars(h.rarity)}">
      <div class="hm-art hcard" style="aspect-ratio:auto"><span class="h-role">${h.role}</span><div class="h-art" style="width:100%;font-size:54px">${heroArt(id)}</div></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:17px;font-weight:900">${h.name}</div>
        <div style="font-size:11.5px;font-weight:800;color:${rar.color}">${rar.name}</div>
        ${owned ? `<div style="font-size:12px;margin-top:2px">Nv.${r.lv} / ${cap}${r.lv < cap ? ' <b style="color:#4ade80">▲ puede mejorar</b>' : ''}</div>
        <div style="color:#ffd166;font-size:12px;letter-spacing:-1px">${starsText(r.evo)}</div>` : '<div style="font-size:12px;margin-top:2px">🔒 Aún no lo tienes</div>'}
        <div style="font-size:11px;color:var(--mute);margin-top:4px">⚔️ ${st.atk} · 🛡️ ${st.def} · ❤️ ${st.hp}</div>
      </div>
      <button type="button" class="x" onclick="closeHeroModal()">✕</button>
    </div>
    <div class="frag-box">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800"><span>${itemArt('evo_fragment')} ${itemName('evo_fragment')}</span><span>${r.frags} / ${need}</span></div>
      <div class="frag-bar"><span style="width:${pct}%"></span></div>
      <div style="font-size:10.5px;color:var(--mute)">${label} · tope ${CONFIG.maxFragments}</div>
    </div>
    <div class="hm-btns">
      ${owned ? `<button type="button" class="btn ${can ? 'gold' : 'dim'}" onclick="evolveHero('${id}')">⭐ Evolucionar</button>
      <button type="button" class="btn ${r.lv < cap ? '' : 'dim'}" onclick="trainHeroWithBook('${id}')">${itemArt('valor_tome')} Entrenar (+XP) · ${state.items.valor_tome || 0}</button>` : ''}
      <button type="button" class="btn gold" onclick="closeHeroModal();openSummonScreen()">${itemArt('evo_fragment')} Obtener fragmentos</button>
    </div>`;
}

/* ---------- Modales genéricos (info de objetos / resultados) ---------- */
function showModal(html){
  $('#infoModalCard').innerHTML = html;
  $('#infoModal').classList.add('open');
}
function closeInfoModal(){ $('#infoModal').classList.remove('open'); }
function showItemInfo(id){
  const it = ITEMS_DATA[id];
  if(!it) return;
  showModal(`
    <div style="text-align:center">
      <div class="sum-bigico">${itemArt(id)}</div>
      <div style="font-size:16px;font-weight:900;margin:6px 0 4px">${it.name}</div>
      <div style="font-size:12.5px;color:var(--mute);line-height:1.35">${it.desc}</div>
      <button type="button" class="btn" style="margin-top:12px" onclick="closeInfoModal()">Cerrar</button>
    </div>`);
}

/* ---------- Invocación: Pergamino de Leva y Estandarte Real ---------- */
function ensureSummonState(){
  if(!state.items || typeof state.items !== 'object') state.items = {...CONFIG.startItems};
  Object.keys(CONFIG.startItems).forEach(k => { if(typeof state.items[k] !== 'number') state.items[k] = CONFIG.startItems[k]; });
  if(!state.summon || typeof state.summon !== 'object') state.summon = {date: '', levaFree: 0, nextLevaAt: 0, royalFree: 0, pity: 0};
  const s = state.summon, today = limaDateKey(gameNow());
  if(s.date !== today){ s.date = today; s.levaFree = 0; s.nextLevaAt = 0; s.royalFree = 0; }
  s.pity = Math.max(0, Number(s.pity) || 0);
  return s;
}

function summonLabels(){
  const s = ensureSummonState(), L = CONFIG.summon.leva, R = CONFIG.summon.royal, now = gameNow();
  const o = {};
  const left = L.freePerDay - s.levaFree;
  if(left <= 0){
    o.levaFree = false;
    o.levaStatus = `🎁 Gratis agotado · reinicia en ${fmtHMS(limaSecondsToMidnight())} (00:00 Perú)`;
  }else if(now < s.nextLevaAt){
    o.levaFree = false;
    o.levaStatus = `⏱ Próximo gratis en ${fmtHMS((s.nextLevaAt - now) / 1000)} · quedan ${left}/${L.freePerDay}`;
  }else{
    o.levaFree = true;
    o.levaStatus = `🎁 Giro gratis disponible · quedan ${left}/${L.freePerDay} hoy`;
  }
  o.leva1 = o.levaFree ? '🎁 1 giro · GRATIS' : `1 giro · ${L.cost1} ${itemArt(L.item)}`;
  o.leva10 = `10 giros · ${L.cost10} ${itemArt(L.item)}`;
  if(s.royalFree >= R.freePerDay){
    o.royalFree = false;
    o.royalStatus = `🎁 Gratis agotado · reinicia en ${fmtHMS(limaSecondsToMidnight())} (00:00 Perú)`;
  }else{
    o.royalFree = true;
    o.royalStatus = '🎁 Giro gratis disponible hoy';
  }
  o.royal1 = o.royalFree ? '🎁 1 giro · GRATIS' : `1 giro · ${R.cost1} ${itemArt(R.item)}`;
  o.royal10 = `10 giros · ${R.cost10} ${itemArt(R.item)}`;
  o.pity = `SSR garantizado en: ${s.pity}/${R.pityMax}`;
  return o;
}

function weightedPick(list){
  let t = list.reduce((a, x) => a + x.w, 0), r = Math.random() * t;
  for(const x of list){ if((r -= x.w) < 0) return x; }
  return list[list.length - 1];
}
function heroPool(rars){
  const p = HEROES.filter(h => rars.includes(h.rarity));
  return p.length ? p : HEROES;
}

function pullOne(kind, ten){
  const C = CONFIG.summon[kind], s = state.summon;
  let ssr = false;
  if(kind === 'royal'){
    s.pity++;
    if(s.pity >= C.pityMax) ssr = true;
    else if(Math.random() < (ten ? C.ssrChance10 : C.ssrChance1)) ssr = true;
    if(ssr) s.pity = 0;
  }
  let hero, qty;
  if(ssr){
    const pool = heroPool(C.ssrRarities);
    hero = pool[Math.floor(Math.random() * pool.length)];
    qty = C.ssrFrags;
  }else{
    const pool = heroPool(C.rarities);
    hero = pool[Math.floor(Math.random() * pool.length)];
    qty = weightedPick(ten ? C.qty10 : C.qty1).q;
  }
  const res = addHeroFragments(hero.id, qty);
  return {id: hero.id, qty, ssr, unlocked: res.unlocked};
}

function doPull(kind, n){
  const s = ensureSummonState(), C = CONFIG.summon[kind], now = gameNow();
  let free = false, cost = 0;
  if(n === 1){
    free = kind === 'leva' ? (s.levaFree < C.freePerDay && now >= s.nextLevaAt) : (s.royalFree < C.freePerDay);
    if(!free) cost = C.cost1;
  }else cost = C.cost10;
  if(cost > 0 && (state.items[C.item] || 0) < cost){
    toast(`⚠️ Te faltan ${itemName(C.item)}. Toca "+" para comprar con 💎`);
    return;
  }
  if(free){
    if(kind === 'leva'){ s.levaFree++; s.nextLevaAt = now + C.freeCooldownSec * 1000; }
    else s.royalFree++;
  }else state.items[C.item] -= cost;
  const results = [];
  for(let i = 0; i < n; i++) results.push(pullOne(kind, n === 10));
  saveState();
  heroesDirty = true;
  renderSummonScreen();
  renderHUD();
  showSummonResults(kind, results);
}

function showSummonResults(kind, results){
  const cards = results.map(r => {
    const h = getHeroById(r.id);
    return `<div class="hcard ${r.ssr ? 'ssr' : ''}" style="${rarityVars(h.rarity)};aspect-ratio:auto;padding:6px 2px">
      <span class="h-role">${rarityOf(h).name}</span>
      <div class="h-art" style="font-size:30px">${heroArt(h.id)}</div>
      <div class="h-nm">${h.name}</div>
      <div class="h-st" style="font-size:11px;letter-spacing:0">+${r.qty} ${itemArt('evo_fragment')}</div>
      ${r.unlocked ? '<div style="font-size:9px;color:#4ade80;font-weight:900">¡NUEVO HÉROE!</div>' : ''}
    </div>`;
  }).join('');
  showModal(`
    <div style="font-size:15px;font-weight:900;text-align:center;margin-bottom:8px">Recompensas · ${itemName(CONFIG.summon[kind].item)}</div>

}

/* ---------- Tutorial ---------- */
function isTutLocked(){ return !!(state && state.tutorial && state.tutorial.active); }
function tutStepDef(){ return CONFIG.tutorial.steps[state.tutorial.step]; }
function tutTargetIdx(){
  if(!isTutLocked()) return -1;
  const st = tutStepDef();
  if(!st) return -1;
  if(st.kind === 'build') return state.grid.findIndex(c => c && c.kind === 'plot' && c.slot === st.bld && !c.bld);
  if(st.kind === 'castle') return state.grid.findIndex(c => c && c.bld === 'castle');
  return -1;
}
function tutFocus(){
  const i = tutTargetIdx();
  if(i < 0) return;
  closeSheet();
  if(state.mapView === 'realm') toggleMapView();
  centerOnCell(state.grid[i].r, state.grid[i].c);
}
function tutMark(){
  document.querySelectorAll('#map .cell.tut-target').forEach(e => e.classList.remove('tut-target'));
  if(!isTutLocked()) return;
  const i = tutTargetIdx();
  const e = i >= 0 ? document.querySelector(`#map .cell[data-idx="${i}"]`) : null;
  if(e) e.classList.add('tut-target');
}
function renderTutorial(){
  const L = document.getElementById('tutorialLayer');
  if(!L) return;
  const t = state.tutorial, on = !!(t && t.active);
  document.body.classList.toggle('tut-lock', on);
  L.classList.toggle('on', on);
  if(!on){ L.innerHTML = ''; L._k = ''; return; }
  const key = `${t.step}|${t.phase}|${t.msg}`;
  if(L._k === key) return;
  L._k = key;
  const st = tutStepDef(), g = CONFIG.tutorial.guide;
  if(t.phase === 'wait'){
    L.innerHTML = `<div class="tut-hint">👉 ${st.hint}</div>`;
    tutFocus();
    return;
  }
  const text = t.phase === 'claim' ? st.doneMsg : st.msgs[t.msg];
  L.innerHTML = `<div class="tut-dialog">
    <div class="tut-guide">${artHTML(g)}</div>
    <div class="tut-box" ${t.phase === 'dialog' ? 'onclick="tutNext()"' : ''}>
      <div class="tut-name">${g.name}</div>
      <div class="tut-text">${text}</div>
      ${t.phase === 'claim' ? '<button type="button" class="btn gold" style="margin-top:8px" onclick="tutClaim()">🎁 Reclamar recompensa</button>' : '<span class="tut-next">▼</span>'}
    </div></div>`;
  if(t.phase === 'dialog') tutFocus();
}
function tutNext(){
  const t = state.tutorial, st = tutStepDef();
  if(!t || !t.active || t.phase !== 'dialog') return;
  if(t.msg < st.msgs.length - 1){ t.msg++; }
  else if(st.kind === 'intro'){ t.step++; t.msg = 0; t.phase = 'dialog'; }
  else{ t.phase = 'wait'; }
  saveState();
  renderTutorial(); tutMark();
}
function tutCheck(){
  const t = state.tutorial;
  if(!t || !t.active || t.phase !== 'wait') return;
  const st = tutStepDef();
  const ok = st.kind === 'build' ? hasBuiltType(st.bld) : getCastleLv() >= st.toLv;
  if(ok){ t.phase = 'claim'; saveState(); renderTutorial(); tutMark(); }
}
function tutClaim(){
  const t = state.tutorial, st = tutStepDef();
  if(!t || !t.active || t.phase !== 'claim') return;
  Object.keys(st.reward || {}).forEach(k => { state.res[k] = (state.res[k] || 0) + st.reward[k]; });
  if(st.gems) state.gems = (state.gems || 0) + st.gems;
  toast('🎁 Recompensa reclamada');
  t.step++; t.msg = 0; t.phase = 'dialog';
  if(t.step >= CONFIG.tutorial.steps.length){ t.active = false; }
  saveState();
  renderTutorial(); renderMap(); renderHUD();
}

  for(let i = 0; i < n; i++) ids.push(CONFIG.adventure.enemyOrder[(level - 1 + i) % CONFIG.adventure.enemyOrder.length]);

function finishAdventureBattle(won){

function gotoBuilding(id){
  const i = state.grid.findIndex(c => c && c.bld === id);
  if(i < 0) return;
  closeSheet();
  if(state.mapView === 'realm') toggleMapView();
  centerOnCell(state.grid[i].r, state.grid[i].c);
  setTimeout(() => openSheet('plot', i), 350);
}
function checkMilestones(){
  if(!state || !state.grid || isTutLocked() || document.getElementById('infoModal').classList.contains('open')) return;
  if(!Array.isArray(state.milestonesSeen)) state.milestonesSeen = [];
  const c = getCastleLv();
  const reached = CONFIG.milestones.filter(m => c >= m && !state.milestonesSeen.includes(m));
  if(!reached.length) return;
  const m = reached[reached.length - 1];
  state.milestonesSeen.push(...reached);
  saveState();
  const list = (CONFIG.castleUnlocks[m] || []).map(u => `<li>${u.b ? bldArt(u.b) + ' ' + bldName(u.b) : u.t}</li>`).join('');
  showModal(`<div style="text-align:center"><div style="font-size:46px">🏆</div>
    <div style="font-size:19px;font-weight:900;color:var(--gold)">¡Felicidades!</div>
    <div style="font-size:14px;font-weight:800;margin:4px 0 8px">Castillo Nv. ${m}</div>
    <ul style="text-align:left;font-size:13px;line-height:1.5;margin:0 0 10px 18px;padding:0">${list}</ul>
    <button type="button" class="btn gold" onclick="closeInfoModal()">¡Continuar!</button></div>`);
}

// Poder de los bots según su puesto: el Top 3 lo tiene todo al máximo (nivel y evolución)
function botScaling(rank){
  if(rank <= 3) return {heroLv: CONFIG.heroMaxLv, heroEvo: CONFIG.maxEvo};
  const t = Math.max(0, Math.min(1, (1000 - rank) / 1000));
  return {
    heroLv: Math.max(1, Math.round(1 + t * (CONFIG.heroMaxLv - 12))),
    heroEvo: Math.round(t * (CONFIG.maxEvo - 1))
  };
}

function natureDeco(r, c){
  if((r <= 1 && c >= 12) || (r >= 11 && r <= 13 && c >= 13)) return '🌊';
  const h = (r * 31 + c * 17 + ((r * c) % 7)) % 11;
  return ['🌲','🌳','🌲','🌿','⛰️','🪨','🌲','🌳','🌿','🌲','🌳'][h];
}

function makeInitialGrid(){
  const arr = [];
  const slotAt = {};
  SLOT_LAYOUT.forEach(s => { slotAt[s.r + ',' + s.c] = s; });
  const cb = CASTLE_BLOCK;
  for(let r = 0; r < GRID_SIZE; r++){
    for(let c = 0; c < GRID_SIZE; c++){
      const key = `${r},${c}`;
      const inCastle = r >= cb.r0 && r < cb.r0 + cb.size && c >= cb.c0 && c < cb.c0 + cb.size;
      const inRing = r >= WALL_MIN && r <= WALL_MAX && c >= WALL_MIN && c <= WALL_MAX;
      const onRing = inRing && (r === WALL_MIN || r === WALL_MAX || c === WALL_MIN || c === WALL_MAX);
      if(r === 7 && c === 7){
        arr.push({r, c, kind:'plot', slot:'castle', need:1, outer:false, bld:'castle', lv:1, ghost:null});
      }else if(inCastle){
        arr.push({r, c, kind:'castlepart'});
      }else if(r === WALL_GATE.r && c === WALL_GATE.c){
        arr.push({r, c, kind:'plot', slot:'wall', need:CONFIG.wallCastle, outer:false, bld:null, lv:0, ghost:'wall'});
      }else if(onRing){
        arr.push({r, c, kind:'wall', corner:(r === WALL_MIN || r === WALL_MAX) && (c === WALL_MIN || c === WALL_MAX)});
      }else if(slotAt[key]){
        const sl = slotAt[key];
        arr.push({r, c, kind:'plot', slot:sl.slot, need:sl.need, outer:false, bld:null, lv:0, ghost:sl.slot});
      }else if(inRing){
        const road = (c === 7 && (r <= 5 || r >= 9)) || r === 9;
        arr.push(road ? {r, c, kind:'road', deco:''} : {r, c, kind:'ground', deco:''});
      }else{
        arr.push({r, c, kind:'nature', deco:natureDeco(r, c)});
      }
    }
  }
  return arr;
}

// Partidas antiguas (cuadrícula 11x11): se llevan los edificios a las parcelas nuevas de su tipo
let gridIdxMap = null;
function migrateGrid(p, fresh){
  if(Array.isArray(p.grid) && p.grid.length === fresh.length && p.grid.some(c => c && c.slot)) return p.grid;
  if(!Array.isArray(p.grid) || p.grid.length !== 121) return fresh;
  gridIdxMap = {};
  const g = fresh.map(c => ({...c}));
  p.grid.forEach((old, oi) => {
    if(!old || !old.bld || (old.lv || 0) <= 0) return;
    if(old.bld === 'castle'){
      const ci = g.findIndex(c => c.bld === 'castle');
      g[ci].lv = old.lv; gridIdxMap[oi] = ci; return;
    }
    const ni = g.findIndex(c => c.kind === 'plot' && c.slot === old.bld && !c.bld);
    if(ni >= 0){ g[ni].bld = old.bld; g[ni].lv = old.lv; gridIdxMap[oi] = ni; }
  });
  return g;
}

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const p = JSON.parse(raw);
    const d = defaultState();
    const tech = {...d.tech, ...(p.tech || {})};
    [['army_t2','tier2Unlock'],['army_t3','tier3Unlock'],['army_t4','tier4Unlock'],['army_t5','tier5Unlock']].forEach(([nodeId, unlockId]) => {
      const level = Math.max(Number(tech[nodeId] || 0) || 0, Number(tech[unlockId] || 0) || 0);
      tech[nodeId] = level;
      tech[unlockId] = level;
    });
    const out = {
      ...d,
      ...p,
      res:{...d.res, ...(p.res || {})},
      grid:migrateGrid(p, d.grid),
      troops:{...d.troops, ...(p.troops || {})},
      tech,
      buildQueues:Array.isArray(p.buildQueues) ? [p.buildQueues[0] || null, p.buildQueues[1] || null] : [null, null],
      claimedQuests:Array.isArray(p.claimedQuests) ? p.claimedQuests : []
    };
    migrateState(out, p);
    return out;
  }catch(_){
    return defaultState();
  }
}

function migrateState(st, p){
  st.trainQueues = {infantry:null, cavalry:null, artillery:null, siege:null, ...(p.trainQueues || {})};
  // partidas antiguas: una sola cola de entrenamiento -> cola por tipo de tropa
  if(p.trainQueue && p.trainQueue.troopId){
    const cat = troopCategory(p.trainQueue.troopId);
    if(!st.trainQueues[cat]) st.trainQueues[cat] = p.trainQueue;
  }
  delete st.trainQueue;
  // si la cuadrícula se migró, las obras en curso apuntan a su nueva parcela
  if(gridIdxMap){
    st.buildQueues = st.buildQueues.map(q => {
      if(!q) return null;
      let ni = gridIdxMap[q.idx];
      if(ni == null) ni = st.grid.findIndex(c => c.kind === 'plot' && c.slot === q.bld && !c.bld);
      return ni >= 0 ? {...q, idx:ni} : null;
    });
    gridIdxMap = null;
  }
  st.research = p.research || null;
  st.wallHeroes = Array.isArray(p.wallHeroes) ? p.wallHeroes : [];
  st.heroRoster = p.heroRoster && typeof p.heroRoster === 'object' ? p.heroRoster : null;
  st.coliseum = p.coliseum && typeof p.coliseum === 'object' ? p.coliseum : null;
  st.bags = {food:{}, wood:{}, stone:{}, gold:{}};
  if(p.bags){
    Object.keys(st.bags).forEach(k => { st.bags[k] = {...(p.bags[k] || {})}; });
  }
  st.clockOffsetMs = Number(p.clockOffsetMs) || 0;
  [[7, 11, 'coliseum', CONFIG.coliseumUnlockCastle], [5, 9, 'soulforge', CONFIG.forgeCastle]].forEach(([r, c, slot, need]) => {
    const gc = st.grid[r * GRID_SIZE + c];
    if(gc && gc.kind === 'ground') st.grid[r * GRID_SIZE + c] = {r, c, kind:'plot', slot, need, outer:false, bld:null, lv:0, ghost:slot};
  });
  st.grid.forEach((gc, i) => {
    // parcelas de un tipo que ya no existe -> terreno normal (evita errores con partidas antiguas)
    if(gc && gc.kind === 'ground') gc.deco = '';   // sin adornos dentro de la ciudad
    if(gc && gc.kind === 'plot' && gc.slot && !BLD[gc.slot]) st.grid[i] = {r:gc.r, c:gc.c, kind:'ground', deco:''};
    if(gc && gc.slot === 'techlab' && !gc.bld) gc.need = CONFIG.researchCastle;
    if(gc && gc.slot === 'warhall' && !gc.bld) gc.need = CONFIG.warhallCastle;
    if(gc && gc.bld === 'wall' && (gc.lv || 0) < CONFIG.wallCastle) gc.lv = CONFIG.wallCastle;   // la Muralla nace en Nv. 6
  });
  if(!['resources', 'forces'].includes(st.buildCat)) st.buildCat = 'resources';
  st.milestonesSeen = Array.isArray(p.milestonesSeen) ? p.milestonesSeen : [];
  const _cc = st.grid.find(x => x && x.bld === 'castle');
  const _progressed = (_cc && _cc.lv > 1) || st.grid.some(x => x && x.bld && x.bld !== 'castle' && (x.lv || 0) > 0);
  if(!p.tutorial) st.tutorial = _progressed ? {active:false, step:99, phase:'dialog', msg:0} : {active:true, step:0, phase:'dialog', msg:0};
  st.adventure = (p.adventure && typeof p.adventure === 'object') ? p.adventure : {cleared:0};
}

function fmtNum(n){
  n = Math.floor(Number(n) || 0);
  if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if(n >= 10000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(n);
}

function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if(d > 0) return `${d}d ${h}h`;
  if(h > 0) return `${h}h ${m}m`;
  if(m > 0) return `${m}m ${String(s).padStart(2,'0')}s`;
  return `${s}s`;
}

/* ---------- Bolsas del Depósito ---------- */
function addBag(resId, size, n = 1){
  if(!state.bags) state.bags = {food:{}, wood:{}, stone:{}, gold:{}};
  if(!state.bags[resId]) state.bags[resId] = {};
  state.bags[resId][size] = (state.bags[resId][size] || 0) + n;
}
function getBagCount(resId, size){ return Number(state.bags?.[resId]?.[size] || 0); }
function getTotalBags(){
  let n = 0;
  RES.forEach(r => BAG_SIZES.forEach(sz => { n += getBagCount(r.id, sz); }));
  return n;
}
function useBag(resId, size, silent = false){
  if(getBagCount(resId, size) <= 0) return false;
  state.bags[resId][size] -= 1;
  state.res[resId] = (state.res[resId] || 0) + size;      // las bolsas pueden superar el tope del almacén
  if(!silent){
    saveState();
    const r = RES.find(x => x.id === resId);
    toast(`🎒 +${fmtNum(size)} ${r ? r.name : resId}`);
    renderHUD();
  }
  return true;
}
function autoUseBags(){
  if(!depositNeed) return;
  let used = 0;
  RES.forEach(r => {
    let deficit = (depositNeed[r.id] || 0) - (state.res[r.id] || 0);
    while(deficit > 0){
      const avail = BAG_SIZES.filter(sz => getBagCount(r.id, sz) > 0);
      if(!avail.length) break;
      const pick = avail.find(sz => sz >= deficit) || avail[avail.length - 1];
      useBag(r.id, pick, true);
      deficit -= pick; used++;
    }
  });
  saveState(); renderHUD();
  toast(used ? `🎒 ${used} bolsa${used > 1 ? 's' : ''} usada${used > 1 ? 's' : ''}` : '🎒 No tienes bolsas para cubrir lo que falta');
}

  else if(sheetMode !== 'deposit') depositReturn = null;
